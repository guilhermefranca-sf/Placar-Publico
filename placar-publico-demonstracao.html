/* ---------- Pessoas nas listas ---------- */

const linkItem = (cargo, it) => (cargo === 'federais' ? `#/federais/${it.id}` : `#/${cargo}/${it.uf}/${it.id}`);
const cmpNome = (a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR');

function avatarHtml(it) {
  const foto = urlSegura(it.foto);
  if (foto) return html`<img class="foto" loading="lazy" alt="" src="${foto}" data-ini="${iniciais(it.nome)}">`;
  return html`<span class="avatar" aria-hidden="true">${iniciais(it.nome)}</span>`;
}

const metaPessoa = it => `${it.partido || 'Sem partido'} · ${it.municipio ? it.municipio + '/' : ''}${it.uf}`;

function linhaRank(cargo, it) {
  return html`<li><a class="linha-rank ${it.nota == null ? 'sem-nota' : ''}" href="${linkItem(cargo, it)}">
    <span class="pos">${it.rank != null ? fmtNum.format(it.rank) : '–'}</span>
    ${avatarHtml(it)}
    <span><span class="rank-nome">${it.nome}</span><br><span class="rank-meta">${metaPessoa(it)}</span></span>
    ${notaHtml(it.nota)}
  </a></li>`;
}

/* ---------- Tela de um cargo ---------- */

async function viewCargo(cargo, token, inicio) {
  const c = CARGOS[cargo];
  document.title = inicio ? 'Placar Público' : `${c.rotulo} · Placar Público`;
  mostrar(app, html`${cabecalhoCargo(cargo, inicio)}
    <div class="resumo-cargo">${Array.from({ length: 4 }, () => html`<div class="esq esq-card"></div>`)}</div>
    ${esqueletoLinhas(6)}`);

  const arquivo = { federais: 'federais.json', governadores: 'governadores.json', prefeitos: 'ranking-prefeitos.json' }[cargo];
  let dados = null;
  if (arquivo) {
    try { dados = await lerArquivo(arquivo); } catch (e) {
      console.error(e);
      if (token === rotaToken) mostrar(app, html`${cabecalhoCargo(cargo, inicio)}<div id="erro"></div>`);
      if (token === rotaToken) mostrarErro($('#erro'), 'Ainda não há dados deste cargo.', () => viewCargo(cargo, token, inicio));
      return;
    }
  }
  if (token !== rotaToken) return;

  if (c.nota) montarCargoComNota(cargo, dados, inicio);
  else montarCargoSemNota(cargo, inicio, token);
}

function resumoCargo(cargo, dados) {
  const m = ((DADOS.meta.cargos || {})[cargo]) || {};
  const f = DADOS.meta.fontes || {};
  const fonte = cargo === 'federais' ? f.camara : f.siconfi;
  const quando = fonte && fonte.atualizadoEm ? dataHoraBR(fonte.atualizadoEm) : '—';
  const total = dados.total ?? m.total;
  const comNota = dados.comNota ?? m.comNota;
  const base = cargo === 'federais'
    ? { rotulo: `Dados de ${dados.ano}`, legenda: `Câmara dos Deputados · atualizado ${quando}` }
    : { rotulo: `Contas de ${dados.exercicio ?? '—'}`, legenda: `Tesouro Nacional · atualizado ${quando}` };
  return html`<section class="resumo-cargo" aria-label="Resumo">
    <div class="stat"><span class="stat-rotulo">${cargo === 'federais' ? 'Deputados' : 'Eleitos'}</span><span class="stat-valor">${fmtNum.format(total)}</span><span class="stat-legenda">${cargo === 'federais' ? 'em exercício hoje' : `eleitos em ${dados.ano ?? '—'}`}</span></div>
    <div class="stat"><span class="stat-rotulo">Com nota</span><span class="stat-valor">${fmtNum.format(comNota)}</span><span class="stat-legenda">${total - comNota ? `${fmtNum.format(total - comNota)} sem dados suficientes` : 'todos'}</span></div>
    <div class="stat"><span class="stat-rotulo">Nota média</span><span class="stat-valor">${fmtNota(m.media)}</span><span class="stat-legenda">de 0 a 100</span></div>
    <div class="stat"><span class="stat-rotulo">${base.rotulo}</span><span class="stat-valor">${quando.split(/[ ,]/)[0] || '—'}</span><span class="stat-legenda">${base.legenda}</span></div>
  </section>`;
}

function montarCargoComNota(cargo, dados, inicio) {
  const itens = dados.itens;
  const rankeados = itens.filter(i => i.nota != null).sort((a, b) => a.rank - b.rank);
  const n = Math.min(10, Math.floor(rankeados.length / 2));
  const top = rankeados.slice(0, n);
  const fundo = rankeados.slice(rankeados.length - n).reverse();
  const c = CARGOS[cargo];

  mostrar(app, html`${cabecalhoCargo(cargo, inicio)}
    ${resumoCargo(cargo, dados)}
    ${n ? html`<section class="destaques" aria-label="Maiores e menores notas">
      <div class="quadro quadro-alta">
        <h2>Maiores notas</h2>
        <p>As ${n} primeiras posições entre ${fmtNum.format(rankeados.length)} com nota.</p>
        <ul class="lista-rank">${top.map(i => linhaRank(cargo, i))}</ul>
      </div>
      <div class="quadro quadro-baixa">
        <h2>Menores notas</h2>
        <p>As ${n} últimas posições. Nota baixa não é acusação: <a href="#/metodologia">veja o que ela mede</a>.</p>
        <ul class="lista-rank">${fundo.map(i => linhaRank(cargo, i))}</ul>
      </div>
    </section>` : ''}
    <section aria-label="Ranking completo">
      <div class="ranking-topo"><h2>Ranking completo</h2><span class="contagem" id="r-contagem" aria-live="polite"></span></div>
      <div class="filtros filtros-rank">
        <label class="campo"><span>${cargo === 'prefeitos' ? 'Nome ou município' : 'Nome'}</span>
          <input id="r-busca" type="search" placeholder="Digite parte do nome" autocomplete="off"></label>
        <label class="campo"><span>Estado</span>
          <select id="r-uf"><option value="">Todos</option>${UFS.map(u => html`<option value="${u}">${u}</option>`)}</select></label>
        <label class="campo"><span>Partido</span>
          <select id="r-partido"><option value="">Todos</option>${[...new Set(itens.map(i => i.partido).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR')).map(p => html`<option value="${p}">${p}</option>`)}</select></label>
        <label class="campo"><span>Ordem</span>
          <select id="r-ordem">
            <option value="maior">Maior nota primeiro</option>
            <option value="menor">Menor nota primeiro</option>
            <option value="nome">Nome (A a Z)</option>
          </select></label>
      </div>
      <ul class="lista-rank" id="r-lista"></ul>
      <div class="mais-linha" id="r-mais"></div>
      <p class="nota">${c.singular === 'Deputado federal'
        ? 'Quem aparece sem nota não tem dados suficientes no ano (por exemplo, assumiu o mandato há poucas semanas). Abra o perfil para ver o motivo.'
        : 'Quem aparece sem nota não tem relatórios fiscais do último ano fechado no Tesouro Nacional, ou o município não foi encontrado na base. Abra o perfil para ver o motivo.'}
        A lista de eleitos vem do TSE e não registra substituições depois da eleição. <a href="#/metodologia">Como a nota é calculada</a>.</p>
    </section>`);

  const f = estado.filtros[cargo] || (estado.filtros[cargo] = { busca: '', uf: '', partido: '', ordem: 'maior', limite: 50 });
  $('#r-busca').value = f.busca;
  $('#r-uf').value = f.uf;
  $('#r-partido').value = f.partido;
  $('#r-ordem').value = f.ordem;

  const ORDENS = {
    maior: (a, b) => (a.rank ?? 1e9) - (b.rank ?? 1e9) || cmpNome(a, b),
    menor: (a, b) => ((a.nota == null) - (b.nota == null)) || (b.rank ?? 0) - (a.rank ?? 0) || cmpNome(a, b),
    nome: cmpNome
  };
  const desenhar = () => {
    const q = semAcento(f.busca.trim());
    const lista = itens.filter(i =>
      (!q || semAcento(i.nome).includes(q) || semAcento(i.municipio || '').includes(q)) &&
      (!f.uf || i.uf === f.uf) && (!f.partido || i.partido === f.partido)).sort(ORDENS[f.ordem]);
    const visiveis = lista.slice(0, f.limite);
    $('#r-contagem').textContent = lista.length === itens.length
      ? `${fmtNum.format(lista.length)} no total`
      : plural(lista.length, 'resultado', 'resultados');
    mostrar($('#r-lista'), visiveis.length ? html`${visiveis.map(i => linhaRank(cargo, i))}` : html`<li class="vazio">Ninguém encontrado com esses filtros.</li>`);
    mostrar($('#r-mais'), lista.length > f.limite
      ? html`<button class="botao" type="button" data-mais>Mostrar mais (${fmtNum.format(lista.length - f.limite)} restantes)</button>` : html``);
  };
  $('#r-busca').addEventListener('input', e => { f.busca = e.target.value; f.limite = 50; desenhar(); });
  $('#r-uf').addEventListener('change', e => { f.uf = e.target.value; f.limite = 50; desenhar(); });
  $('#r-partido').addEventListener('change', e => { f.partido = e.target.value; f.limite = 50; desenhar(); });
  $('#r-ordem').addEventListener('change', e => { f.ordem = e.target.value; f.limite = 50; desenhar(); });
  $('#r-mais').addEventListener('click', e => { if (e.target.closest('[data-mais]')) { f.limite += 100; desenhar(); } });
  desenhar();
}

/* ---------- Cargos sem nota: lista oficial de eleitos ---------- */

const POR_QUE_SEM_NOTA = {
  estaduais: 'Ainda não existe uma fonte única e padronizada com presença, votos e projetos dos parlamentos dos 27 estados. Cada assembleia publica seus dados de um jeito, e algumas quase não publicam. Uma nota só é justa se o critério for o mesmo para todos, então por enquanto o Placar Público mostra apenas a lista oficial de eleitos.',
  vereadores: 'São mais de cinco mil câmaras municipais, cada uma com seu sistema e seu jeito de publicar presença, votos e projetos. Não há uma fonte nacional padronizada. Uma nota só é justa se o critério for o mesmo para todos, então por enquanto o Placar Público mostra apenas a lista oficial de eleitos.'
};

async function montarCargoSemNota(cargo, inicio, token) {
  const c = CARGOS[cargo];
  const ehVereador = cargo === 'vereadores';
  mostrar(app, html`${cabecalhoCargo(cargo, inicio)}
    <section class="cartao" aria-label="Por que ainda não há nota">
      <h2>Por que ainda não há nota <span class="em-breve">em estudo</span></h2>
      <p>${POR_QUE_SEM_NOTA[cargo]}</p>
      <p>Quando houver dados oficiais comparáveis, a nota entra com o mesmo método descrito em <a href="#/metodologia">Metodologia</a>.</p>
    </section>
    <section class="secao" aria-label="Lista de eleitos">
      <h2 class="painel-titulo">${ehVereador ? 'Vereadores eleitos' : 'Deputados estaduais eleitos'}</h2>
      <div class="filtros filtros-auto">
        <label class="campo"><span>Estado</span>
          <select id="s-uf">${UFS.filter(u => !(ehVereador && u === 'DF')).map(u => html`<option value="${u}" ${u === estado.uf ? 'selected' : ''}>${u} · ${NOMES_UF[u]}</option>`)}</select></label>
        ${ehVereador ? html`<label class="campo"><span>Município</span><select id="s-mun"><option value="">Escolha um município</option></select></label>` : ''}
        <label class="campo"><span>Nome</span><input id="s-busca" type="search" placeholder="Digite parte do nome" autocomplete="off"></label>
        <label class="campo"><span>Partido</span><select id="s-partido"><option value="">Todos</option></select></label>
      </div>
      <p class="contagem" id="s-contagem" aria-live="polite"></p>
      <div id="s-corpo">${esqueletoLinhas(4)}</div>
      <div class="mais-linha" id="s-mais"></div>
      <p class="nota" id="s-nota"></p>
    </section>`);

  const vista = { uf: ehVereador && estado.uf === 'DF' ? 'SP' : estado.uf, mun: '', busca: '', partido: '', limite: 60, dado: null };
  const vivo = () => token === rotaToken;

  async function carregarUf() {
    mostrar($('#s-corpo'), esqueletoLinhas(4));
    $('#s-contagem').textContent = '';
    try {
      vista.dado = await lerArquivo(`${cargo}-${vista.uf}.json`);
    } catch (e) {
      if (!vivo()) return;
      vista.dado = null;
      mostrar($('#s-corpo'), html`<p class="vazio">Ainda não há a lista deste estado. Ela aparece depois da próxima atualização diária.</p>`);
      return;
    }
    if (!vivo()) return;
    const itens = vista.dado.itens;
    const partidos = [...new Set(itens.map(i => i.partido).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
    mostrar($('#s-partido'), html`<option value="">Todos</option>${partidos.map(p => html`<option value="${p}">${p}</option>`)}`);
    vista.partido = '';
    if (ehVereador) {
      const muns = [...new Set(itens.map(i => i.municipio))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
      mostrar($('#s-mun'), html`<option value="">Escolha um município (${fmtNum.format(muns.length)})</option>${muns.map(m => html`<option value="${m}">${m}</option>`)}`);
      vista.mun = '';
    }
    mostrar($('#s-nota'), html`A lista vem do TSE e mostra quem foi eleito em ${vista.dado.ano}. Substituições depois da eleição (suplentes que assumiram, renúncias, cassações) não aparecem.`);
    desenhar();
  }

  function desenhar() {
    if (!vista.dado) return;
    const q = semAcento(vista.busca.trim());
    const exigeFiltro = ehVereador && !vista.mun && q.length < 3;
    if (exigeFiltro) {
      $('#s-contagem').textContent = '';
      mostrar($('#s-corpo'), html`<p class="vazio">Escolha um município ou digite pelo menos 3 letras do nome.</p>`);
      mostrar($('#s-mais'), html``);
      return;
    }
    const lista = vista.dado.itens.filter(i =>
      (!vista.mun || i.municipio === vista.mun) && (!vista.partido || i.partido === vista.partido) &&
      (!q || semAcento(i.nome).includes(q) || semAcento(i.urna || '').includes(q)));
    const visiveis = lista.slice(0, vista.limite);
    $('#s-contagem').textContent = plural(lista.length, 'eleito', 'eleitos');
    mostrar($('#s-corpo'), visiveis.length ? html`<ul class="eleitos">${visiveis.map(i => html`<li>
        <a class="eleito" href="#/${cargo}/${i.uf}/${i.id}">
          <span class="avatar" aria-hidden="true">${iniciais(i.nome)}</span>
          <span class="rank-nome">${i.nome}</span>
          <span class="rank-meta">${i.partido || 'Sem partido'}${i.municipio ? ' · ' + i.municipio : ''}</span>
        </a></li>`)}</ul>` : html`<p class="vazio">Ninguém encontrado com esses filtros.</p>`);
    mostrar($('#s-mais'), lista.length > vista.limite
      ? html`<button class="botao" type="button" data-mais>Mostrar mais (${fmtNum.format(lista.length - vista.limite)} restantes)</button>` : html``);
  }

  $('#s-uf').addEventListener('change', e => { vista.uf = e.target.value; estado.uf = vista.uf; salvarPref('uf', vista.uf); vista.limite = 60; carregarUf(); });
  if (ehVereador) $('#s-mun').addEventListener('change', e => { vista.mun = e.target.value; vista.limite = 60; desenhar(); });
  $('#s-busca').addEventListener('input', e => { vista.busca = e.target.value; vista.limite = 60; desenhar(); });
  $('#s-partido').addEventListener('change', e => { vista.partido = e.target.value; vista.limite = 60; desenhar(); });
  $('#s-mais').addEventListener('click', e => { if (e.target.closest('[data-mais]')) { vista.limite += 120; desenhar(); } });
  $('#s-uf').value = vista.uf;
  carregarUf();
}

</script>
  <script>
'use strict';

/* =====================================================================
   Placar Público — perfis
   Deputado federal: nota + abas ao vivo da Câmara (do De Olho na Câmara).
   Governador e prefeito: nota calculada com as contas do Tesouro Nacional.
   Deputado estadual e vereador: ficha da lista oficial de eleitos (sem nota).
   ===================================================================== */

const ABAS_FED = ['nota', 'projetos', 'votacoes', 'presenca', 'gastos'];
const ROTULO_ABA = { nota: 'Nota', projetos: 'Projetos', votacoes: 'Votações', presenca: 'Presença', gastos: 'Gastos' };

function esqueletoPerfil(voltarHref, voltarTexto) {
  return html`
    <a class="voltar" href="${voltarHref}">${voltarTexto}</a>
    <div class="perfil-topo"><div class="esq" style="width:112px;height:149px"></div><div>${esqueletoLinhas(3)}</div></div>
    ${esqueletoLinhas(4)}`;
}

function naoEncontrado(voltarHref, voltarTexto, quem) {
  mostrar(app, html`<a class="voltar" href="${voltarHref}">${voltarTexto}</a>
    <div class="cartao"><h1>${quem} não encontrado(a)</h1>
      <p>Esta pessoa não está na lista de hoje. Ela pode ter deixado o cargo, ou o endereço pode estar errado.</p></div>`);
}

function fichaHtml(linhas) {
  const validas = linhas.filter(([, v]) => v);
  return validas.length ? html`${validas.map(([r, v]) => html`<div><dt>${r}</dt><dd>${v}</dd></div>`)}` : html``;
}

function cartaoNota(item, totalComNota, textoExtra = '') {
  return html`<section class="nota-perfil" aria-label="Nota">
    ${notaHtml(item.nota, true)}
    <div>
      <h2>${item.nota == null ? 'Sem nota por enquanto' : 'Nota de 0 a 100'}</h2>
      ${item.rank != null ? html`<p><strong class="posicao">${fmtNum.format(item.rank)}º lugar</strong> entre ${fmtNum.format(totalComNota)} com nota${textoExtra}.</p>` : ''}
      ${item.nota == null
        ? html`<p>${item.motivo || 'Não há dados suficientes para calcular a nota.'}</p>`
        : html`<p>A nota resume os critérios abaixo. Ela não mede a qualidade do trabalho e não aponta irregularidade. <a href="#/metodologia">Como é calculada</a>.</p>`}
      ${item.obs ? html`<p>${item.obs}</p>` : ''}
    </div>
  </section>`;
}

/* Lista dos critérios da nota, com a barra, o peso e a frase que explica o número. */
function montarNota(el, item, grupo) {
  const defs = ((DADOS.metodo && DADOS.metodo[grupo] && DADOS.metodo[grupo].componentes) || []);
  const comp = item.comp || [];
  const porK = new Map(comp.map(c => [c.k, c]));
  const linhas = defs.length ? defs : comp.map(c => ({ k: c.k, rotulo: c.k, peso: null }));
  if (!comp.length) {
    return mostrar(el, html`<h2 class="painel-titulo">Como a nota é formada</h2>
      <p class="painel-sub">${item.motivo || 'Não há dados suficientes para mostrar os critérios.'}</p>
      <p class="nota">Veja em <a href="#/metodologia">Metodologia</a> quais critérios entram na nota.</p>`);
  }
  const faltam = linhas.some(d => !porK.has(d.k) || porK.get(d.k).s == null);
  mostrar(el, html`
    <h2 class="painel-titulo">Como a nota é formada</h2>
    <p class="painel-sub">Cada critério vai de 0 a 100. A nota final é a média deles, com os pesos abaixo.</p>
    <ul class="comp-lista">${linhas.map(d => {
      const c = porK.get(d.k);
      const s = c ? c.s : null;
      return html`<li class="comp ${s == null ? 'sem' : ''}">
        <span class="comp-nome">${d.rotulo}${d.peso != null ? html`<span class="comp-peso">peso ${d.peso}%</span>` : ''}</span>
        <span class="comp-nota">${s == null ? 'sem dado' : fmtNota(s)}</span>
        <span class="comp-barra" role="img" aria-label="${s == null ? 'sem dado' : fmtNota(s) + ' de 100'}"><span style="width:${s == null ? 0 : Math.max(0, Math.min(100, s))}%"></span></span>
        <span class="comp-fato">${c && c.f ? c.f : 'Não há este dado para esta pessoa neste período.'}</span>
      </li>`;
    })}</ul>
    ${faltam ? html`<p class="nota">Quando um critério não tem dado, a nota usa só os que existem, mantendo os pesos proporcionais.</p>` : ''}
    <p class="nota">${grupo === 'federais'
      ? 'A nota compara o que o deputado fez no ano com as regras do método. Mede quantidade e cumprimento de deveres, não a qualidade do mandato. Quem assumiu durante o ano é avaliado só pelo período em que esteve no cargo.'
      : 'A nota olha as contas do último ano fechado, que pertencem à administração daquele ano. Não mede saúde, educação, obras ou serviços, e não aponta irregularidade.'}
      Os números vêm de fontes oficiais; veja de onde em <a href="#/fontes">Fontes</a>.</p>`);
}

function avisoEleitos(ano, extra = '') {
  return html`<section class="cartao cartao-aviso">
    <h3>Quem está no cargo hoje?</h3>
    <p>Esta lista vem do TSE e mostra quem foi eleito em ${ano}. Se houve renúncia, cassação, afastamento ou morte depois da eleição, o cargo pode estar com outra pessoa, e isso não aparece aqui. ${extra}</p>
  </section>`;
}

/* ---------- Roteamento dos perfis ---------- */

function viewPerfil(cargo, uf, id, aba, token) {
  if (cargo === 'federais') return viewFederal(id, aba, token);
  if (cargo === 'governadores' || cargo === 'prefeitos') return viewExecutivo(cargo, uf, id, token);
  return viewEleito(cargo, uf, id, token);
}

/* ---------- Governador e prefeito ---------- */

async function viewExecutivo(cargo, uf, id, token) {
  const c = CARGOS[cargo];
  const voltar = [`#/${cargo}`, `← ${c.rotulo}`];
  mostrar(app, esqueletoPerfil(...voltar));
  let dado;
  try {
    dado = await lerArquivo(cargo === 'governadores' ? 'governadores.json' : `prefeitos-${uf}.json`);
  } catch (e) {
    console.error(e);
    if (token === rotaToken) { mostrar(app, html`<div id="erro"></div>`); mostrarErro($('#erro'), 'Não foi possível carregar esta página.', () => viewExecutivo(cargo, uf, id, token)); }
    return;
  }
  if (token !== rotaToken) return;
  const item = dado.itens.find(i => i.id === String(id));
  if (!item) return naoEncontrado(...voltar, c.singular);

  const ehPref = cargo === 'prefeitos';
  document.title = `${item.nome} · Placar Público`;
  const totalNacional = ehPref ? ((DADOS.meta.cargos || {}).prefeitos || {}).comNota : dado.comNota;
  let extra = '';
  if (ehPref && item.rank != null) {
    const doEstado = dado.itens.filter(i => i.nota != null);
    extra = `, e ${fmtNum.format(doEstado.filter(i => i.rank < item.rank).length + 1)}º entre ${fmtNum.format(doEstado.length)} em ${uf}`;
  }
  const lugar = ehPref ? `${item.municipio}/${uf}` : NOMES_UF[uf] || uf;

  mostrar(app, html`
    <a class="voltar" href="${voltar[0]}">${voltar[1]}</a>
    <header class="perfil-topo">
      ${avatarHtml(item)}
      <div>
        <h1 class="perfil-nome">${item.nome}</h1>
        ${item.urna && item.urna !== item.nome ? html`<p class="perfil-civil">Nome de urna: ${item.urna}</p>` : ''}
        <div class="etiquetas">
          <span class="etq">${item.partido || 'Sem partido'}</span>
          <span class="etq">${c.singular} de ${lugar}</span>
          ${item.situacao ? html`<span class="etq neutra">${item.situacao} em ${dado.ano ?? ''}</span>` : ''}
        </div>
      </div>
    </header>
    <dl class="ficha">${fichaHtml([
      ['Idade', item.idade ? `${item.idade} anos` : ''],
      ['Escolaridade', item.instrucao],
      ['Ocupação declarada', item.ocupacao],
      ['População', item.populacao ? fmtNum.format(item.populacao) + ' habitantes' : '']
    ])}</dl>
    ${cartaoNota(item, totalNacional, extra)}
    <section class="painel" id="painel"></section>
    ${avisoEleitos(dado.ano ?? '', dado.exercicio ? `As contas usadas na nota são do exercício de ${dado.exercicio}, o último ano fechado no Tesouro Nacional.` : '')}`);
  montarNota($('#painel'), item, 'executivos');
}

/* ---------- Deputado estadual e vereador (sem nota) ---------- */

async function viewEleito(cargo, uf, id, token) {
  const c = CARGOS[cargo];
  const voltar = [`#/${cargo}`, `← ${c.rotulo}`];
  mostrar(app, esqueletoPerfil(...voltar));
  let dado;
  try { dado = await lerArquivo(`${cargo}-${uf}.json`); } catch (e) {
    console.error(e);
    if (token === rotaToken) { mostrar(app, html`<div id="erro"></div>`); mostrarErro($('#erro'), 'Não foi possível carregar esta página.', () => viewEleito(cargo, uf, id, token)); }
    return;
  }
  if (token !== rotaToken) return;
  const item = dado.itens.find(i => i.id === String(id));
  if (!item) return naoEncontrado(...voltar, c.singular);
  document.title = `${item.nome} · Placar Público`;
  const lugar = item.municipio ? `${item.municipio}/${uf}` : (NOMES_UF[uf] || uf);

  mostrar(app, html`
    <a class="voltar" href="${voltar[0]}">${voltar[1]}</a>
    <header class="perfil-topo">
      ${avatarHtml(item)}
      <div>
        <h1 class="perfil-nome">${item.nome}</h1>
        ${item.urna && item.urna !== item.nome ? html`<p class="perfil-civil">Nome de urna: ${item.urna}</p>` : ''}
        <div class="etiquetas">
          <span class="etq">${item.partido || 'Sem partido'}</span>
          <span class="etq">${c.singular} · ${lugar}</span>
          ${item.situacao ? html`<span class="etq neutra">${item.situacao} em ${dado.ano}</span>` : ''}
        </div>
      </div>
    </header>
    <dl class="ficha">${fichaHtml([
      ['Idade', item.idade ? `${item.idade} anos` : ''],
      ['Escolaridade', item.instrucao],
      ['Ocupação declarada', item.ocupacao]
    ])}</dl>
    <section class="nota-perfil" aria-label="Nota">
      ${notaHtml(null, true)}
      <div>
        <h2>Sem nota por enquanto</h2>
        <p>${POR_QUE_SEM_NOTA[cargo]}</p>
      </div>
    </section>
    ${avisoEleitos(dado.ano)}`);
}

/* ---------- Deputado federal ---------- */

async function viewFederal(id, abaInicial, token) {
  const voltar = ['#/federais', '← Deputados federais'];
  document.title = 'Placar Público';
  mostrar(app, esqueletoPerfil(...voltar));
  let dado;
  try { dado = await lerArquivo('federais.json'); } catch (e) {
    console.error(e);
    if (token === rotaToken) { mostrar(app, html`<div id="erro"></div>`); mostrarErro($('#erro'), 'Não foi possível carregar os dados.', () => viewFederal(id, abaInicial, token)); }
    return;
  }
  if (token !== rotaToken) return;
  const item = dado.itens.find(i => i.id === String(id));
  if (!item) return naoEncontrado(...voltar, 'Deputado(a)');

  const demo = DADOS.demo;
  const abas = demo ? ['nota'] : ABAS_FED;
  document.title = `${item.nome} · Placar Público`;

  mostrar(app, html`
    <a class="voltar" href="${voltar[0]}">${voltar[1]}</a>
    <header class="perfil-topo">
      ${avatarHtml(item)}
      <div>
        <h1 class="perfil-nome">${item.nome}</h1>
        <div class="etiquetas">
          <span class="etq">${item.partido || 'Sem partido'}</span>
          <span class="etq">${item.uf}</span>
          <span class="etq neutra">Deputado(a) federal</span>
        </div>
        ${demo ? '' : html`<p class="perfil-link"><a href="${PORTAL}/deputados/${id}" target="_blank" rel="noopener">Perfil completo no portal da Câmara</a></p>`}
      </div>
    </header>
    <dl class="ficha" id="ficha" hidden></dl>
    ${cartaoNota(item, dado.comNota)}
    ${demo ? html`<section class="cartao cartao-aviso"><h3>Abas ao vivo desligadas</h3>
      <p>Na versão real, este perfil também tem as abas Projetos, Votações, Presença e Gastos, consultadas na hora à Câmara dos Deputados. No modo demonstração elas ficam desligadas porque os deputados são inventados.</p></section>` : html`
    <section class="numeros" aria-label="Resumo ao vivo">
      <a class="stat" href="#/federais/${id}/projetos" data-stat="projetos"><span class="stat-rotulo">Projetos</span><span class="stat-valor">…</span><span class="stat-legenda"></span></a>
      <a class="stat" href="#/federais/${id}/votacoes" data-stat="votacoes"><span class="stat-rotulo">Votações nominais</span><span class="stat-valor">Ver</span><span class="stat-legenda">como votou nos últimos 12 meses</span></a>
      <a class="stat" href="#/federais/${id}/presenca" data-stat="presenca"><span class="stat-rotulo">Presença no Plenário</span><span class="stat-valor">…</span><span class="stat-legenda"></span></a>
      <a class="stat" href="#/federais/${id}/gastos" data-stat="gastos"><span class="stat-rotulo">Cota parlamentar</span><span class="stat-valor">…</span><span class="stat-legenda"></span></a>
    </section>`}
    <div class="barra-abas">
      <nav class="abas" role="tablist" aria-label="Seções do perfil">
        ${abas.map(a => html`<a class="aba" role="tab" href="#/federais/${id}/${a}" data-aba="${a}">${ROTULO_ABA[a]}</a>`)}
      </nav>
      <label class="seletor-ano" id="seletor-ano"><span>Ano</span>
        <select id="ano">${Array.from({ length: ANO_ATUAL - PRIMEIRO_ANO + 1 }, (_, i) => ANO_ATUAL - i).map(a =>
          html`<option value="${a}" ${a === estado.ano ? 'selected' : ''}>${a}</option>`)}</select>
      </label>
    </div>
    <section class="painel" id="painel" role="tabpanel" aria-live="polite"></section>`);

  /* Dados de cadastro, só na versão real. A ficha completa (/deputados/{id}) a Câmara às vezes
     não libera para páginas de outros endereços (CORS), então ela é um extra: se falhar, o perfil
     continua inteiro. */
  if (!demo) {
    Promise.allSettled([
      getJSON(`/deputados?id=${id}`).then(r => (r.dados || [])[0]),
      getJSON(`/deputados/${id}`, { repetir: false }).then(r => r.dados)
    ]).then(([rb, rf]) => {
      if (token !== rotaToken) return;
      const base = rb.status === 'fulfilled' ? rb.value : null;
      const ficha = rf.status === 'fulfilled' ? rf.value : null;
      const st = (ficha && ficha.ultimoStatus) || {};
      const gab = st.gabinete || {};
      const email = gab.email || st.email || (base && base.email) || '';
      const redes = [...((ficha && ficha.redeSocial) || []), ficha && ficha.urlWebsite].filter(u => urlSegura(u));
      const nasc = ficha ? dataBR(ficha.dataNascimento) : '';
      const el = $('#ficha');
      if (!el) return;
      const conteudo = html`${fichaHtml([
        ['Nome civil', ficha && ficha.nomeCivil],
        ['Nascimento', nasc ? `${nasc}${ficha.municipioNascimento ? ` · ${ficha.municipioNascimento}/${ficha.ufNascimento}` : ''}` : ''],
        ['Escolaridade', ficha && ficha.escolaridade],
        ['Gabinete', gab.sala ? `Sala ${gab.sala}, prédio ${gab.predio || '-'}${gab.telefone ? ` · tel. (61) ${gab.telefone}` : ''}` : ''],
        ['E-mail', email]
      ])}${redes.length ? html`<div><dt>Redes e site</dt><dd class="redes">${redes.map(u => html`<a href="${u}" target="_blank" rel="noopener">${rotuloRede(u)}</a>`)}</dd></div>` : ''}`;
      mostrar(el, conteudo);
      el.hidden = !el.children.length;
    });
  }

  const vivo = () => token === rotaToken;
  let aba = abas.includes(abaInicial) ? abaInicial : 'nota';
  let tokenPainel = 0;
  const dados = {};

  const marcarAba = () => {
    $$('.aba').forEach(el => el.setAttribute('aria-selected', String(el.dataset.aba === aba)));
    $$('.stat[data-stat]').forEach(el => el.setAttribute('aria-current', String(el.dataset.stat === aba)));
    $('#seletor-ano').hidden = demo || aba === 'votacoes' || aba === 'nota';
  };

  const iniciarAno = () => {
    if (demo) return;
    const ano = estado.ano;
    const ainda = () => vivo() && ano === estado.ano;
    tile('projetos', '…', `proposições em ${ano}`);
    tile('presenca', '…', 'sessões deliberativas');
    tile('gastos', '…', `gasto em ${ano}`);

    dados.projetos = carregarProjetos(id, ano);
    dados.presenca = carregarPresenca(id, ano);
    dados.gastos = carregarGastos(id, ano);

    dados.projetos.then(d => {
      if (!ainda()) return;
      const n = d.itens.filter(p => SIGLAS_PROJETO.has(p.siglaTipo)).length;
      tile('projetos', fmtNum.format(d.itens.length) + (d.truncado ? '+' : ''), `em ${ano} · ${plural(n, 'projeto ou proposta', 'projetos e propostas')}`);
    }).catch(() => ainda() && tile('projetos', '—', 'não foi possível carregar'));

    dados.presenca.then(d => {
      if (!ainda()) return;
      if (!d.total) return tile('presenca', '—', `sem sessões deliberativas em ${ano}`);
      tile('presenca', `${d.presente} de ${d.total}`, `${d.pct}% · ${plural(d.ausentes.length, 'sessão sem presença', 'sessões sem presença')}`);
    }).catch(() => ainda() && tile('presenca', '—', 'não foi possível carregar'));

    dados.gastos.then(d => {
      if (!ainda()) return;
      tile('gastos', fmtBRL.format(d.total), `gasto em ${ano}`);
    }).catch(() => ainda() && tile('gastos', '—', 'não foi possível carregar'));
  };

  const mostrarAba = async () => {
    const meu = ++tokenPainel;
    const ano = estado.ano;
    const painel = $('#painel');
    const vale = () => vivo() && meu === tokenPainel && (aba === 'votacoes' || aba === 'nota' || ano === estado.ano);
    marcarAba();

    if (aba === 'nota') return montarNota(painel, item, 'federais');
    if (aba === 'votacoes') return painelVotacoes(painel, id, vale);

    mostrar(painel, esqueletoLinhas(6));
    try {
      const d = await dados[aba];
      if (!vale()) return;
      ({ projetos: montarProjetos, presenca: montarPresenca, gastos: montarGastos })[aba](painel, d, { id, ano });
    } catch (e) {
      console.error(e);
      if (vale()) mostrarErro(painel, 'Não foi possível carregar esta seção.', () => { iniciarAno(); mostrarAba(); });
    }
  };

  $('#ano').addEventListener('change', e => {
    estado.ano = Number(e.target.value);
    salvarAno(estado.ano);
    iniciarAno();
    mostrarAba();
  });

  perfilAtual = {
    chave: `federais/${id}`,
    trocarAba(nova) { aba = abas.includes(nova) ? nova : 'nota'; mostrarAba(); }
  };
  iniciarAno();
  mostrarAba();
}

  <script>
'use strict';

/* =====================================================================
   Placar Público — páginas de texto: Metodologia e Fontes
   ===================================================================== */

function tabelaComponentes(componentes) {
  return html`<div class="rolagem"><table class="tabela">
    <thead><tr><th>Critério</th><th class="num">Peso</th><th>Como é medido</th></tr></thead>
    <tbody>${componentes.map(c => html`<tr><td><strong>${c.rotulo}</strong></td><td class="num">${c.peso}%</td><td>${c.regra}</td></tr>`)}</tbody>
  </table></div>`;
}

function viewMetodologia() {
  document.title = 'Metodologia · Placar Público';
  const m = DADOS.metodo;
  mostrar(app, html`<article class="pagina">
    <h1>Como a nota é calculada</h1>
    <p class="lead">A nota vai de 0 a 100 e usa só dados oficiais abertos. Todas as regras estão escritas aqui, e o código que calcula é aberto: quem quiser conferir ou discordar de um peso pode ver e propor outra regra.</p>

    <h2>O que a nota é, e o que ela não é</h2>
    <div class="cartao"><ul class="pontos">
      <li>É um resumo de critérios objetivos que dá para medir com dados públicos, aplicados do mesmo jeito para todos do mesmo cargo.</li>
      <li><strong>Não mede a qualidade do trabalho.</strong> Um deputado pode apresentar muitos projetos ruins ou poucos projetos excelentes; a nota só enxerga a quantidade.</li>
      <li><strong>Nota baixa não é acusação.</strong> Uma ausência pode ser missão oficial, licença ou doença. Um relatório fiscal pode estar atrasado por problema técnico da prefeitura. A nota não sabe o motivo.</li>
      <li>As cores servem só para leitura rápida: 70 ou mais em verde, de 40 a 69 em amarelo, abaixo de 40 em vermelho. Não são faixas oficiais.</li>
    </ul></div>

    ${m ? html`
    <h2>Deputados federais</h2>
    <p>Calculada todo dia com os dados do ano em curso. Quem tem menos de ${m.federais.minSessoes} sessões deliberativas desde a primeira presença no ano fica sem nota, porque o período seria curto demais para comparar.</p>
    ${tabelaComponentes(m.federais.componentes)}

    <h2>Prefeitos e governadores</h2>
    <p>Calculada com as contas do último ano fechado no Tesouro Nacional, atualizadas uma vez por semana. A nota é da administração, e vale para quem estava no cargo naquele ano. Quem tomou posse depois do fim do ano das contas fica sem nota até haver um ano fechado da sua gestão.</p>
    ${tabelaComponentes(m.executivos.componentes)}
    <p>Limites usados nas comparações:</p>
    <ul class="limites">
      <li>Prefeituras: gasto com pessoal até ${m.executivos.limites.M.pessoal}% da receita corrente líquida; dívida até ${m.executivos.limites.M.divida}%.</li>
      <li>Estados e Distrito Federal: gasto com pessoal até ${m.executivos.limites.E.pessoal}%; dívida até ${m.executivos.limites.E.divida}%.</li>
    </ul>
    <p>Se faltar algum critério (por exemplo, a prefeitura não enviou o relatório de dívida), a nota usa os que existem, mas só é calculada se houver pelo menos ${m.executivos.minComponentes} dos 3.</p>` : html`
    <p class="nota">Os detalhes das regras ainda não foram carregados.</p>`}

    <h2>Deputados estaduais e vereadores</h2>
    <p>Estes cargos <strong>ainda não têm nota</strong>. Não existe uma fonte única e padronizada com presença, votos e projetos dos 27 parlamentos estaduais e de mais de cinco mil câmaras municipais. Em vez de inventar uma nota com dados incomparáveis, o Placar Público mostra a lista oficial de eleitos.</p>

    <h2>Limites que você precisa conhecer</h2>
    <div class="cartao"><ul class="pontos">
      <li><strong>Prefeitos e governadores:</strong> a nota ainda não considera saúde, educação, obras e serviços, porque não há dado oficial comparável e atualizado para todas as cidades.</li>
      <li><strong>Quem está no cargo:</strong> a lista de prefeitos, governadores, deputados estaduais e vereadores vem do TSE e mostra quem foi <em>eleito</em>. Renúncia, cassação, afastamento e suplentes que assumiram não aparecem.</li>
      <li><strong>Prefeituras:</strong> o município do TSE é ligado ao do Tesouro pelo nome e pelo estado. Quando não há correspondência exata, a pessoa fica sem nota, em vez de arriscar uma nota errada.</li>
      <li><strong>Em tempo real?</strong> Não exatamente. Os dados são atualizados todo dia (os do TSE e do Tesouro, toda semana). As abas Projetos, Votações, Presença e Gastos dos deputados federais consultam a Câmara na hora em que você abre.</li>
    </ul></div>

    <h2>Quer mudar um peso?</h2>
    <p>Todas as regras estão no arquivo <code>scripts/nota.mjs</code>. Mudar um peso ou um limite lá e rodar a atualização de novo recalcula tudo, e esta página se atualiza sozinha.</p>
  </article>`);
}

function viewFontes() {

  const f = (DADOS.meta && DADOS.meta.fontes) || {};
  const status = x => {
    if (!x) return html`<span>ainda não consultada</span>`;

  };
  const quando = x => (x && x.atualizadoEm ? dataHoraBR(x.atualizadoEm) : '—');
  const anosTse = f.tse && f.tse.eleicoes
    ? (typeof f.tse.eleicoes === 'object' && !Array.isArray(f.tse.eleicoes)
      ? `municipais ${f.tse.eleicoes.municipal}; governadores ${f.tse.eleicoes.governadores}; deputados estaduais ${f.tse.eleicoes.estaduais}`

  mostrar(app, html`<article class="pagina">

    <div class="rolagem"><table class="tabela">

        <tr><td><a href="https://dadosabertos.camara.leg.br" target="_blank" rel="noopener">Dados Abertos da Câmara dos Deputados</a></td>
          <td>Presença em sessões, votações nominais, projetos e cota parlamentar dos deputados federais${f.camara && f.camara.ano ? html` (${f.camara.ano}: ${fmtNum.format(f.camara.sessoes || 0)} sessões, ${fmtNum.format(f.camara.votacoes || 0)} votações nominais)` : ''}.</td>
          <td class="curto">Todo dia</td><td class="curto">${quando(f.camara)}</td><td class="curto">${status(f.camara)}</td></tr>
        <tr><td><a href="https://dadosabertos.tse.jus.br" target="_blank" rel="noopener">Dados Abertos do TSE</a></td>

}

/* =====================================================================
   Placar Público — roteador
   Troca de tela pelo endereço depois do "#":
     #/                         início (deputados federais)
     #/federais  #/governadores  #/prefeitos  #/estaduais  #/vereadores

// Foto que não carrega vira um círculo com as iniciais, sem ícone quebrado.
document.addEventListener('error', e => {
  const img = e.target;
  if (!img || !img.classList || !img.classList.contains('foto') || img.tagName !== 'IMG') return;
  const span = document.createElement('span');
  span.className = 'avatar';
  span.setAttribute('aria-hidden', 'true');
  span.textContent = img.dataset.ini || '?';
  img.replaceWith(span);
}, true);

function marcarMenu(chave) {
  $$('.menu a').forEach(a => a.setAttribute('aria-current', a.dataset.menu === chave ? 'page' : 'false'));
}

function rota() {
  const partes = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const [a, b, c, d] = partes;
  // Trocar só a aba do mesmo deputado não conta como tela nova: o token continua o mesmo.
  const mesmoPerfil = perfilAtual && a === 'federais' && /^\d+$/.test(b || '') && perfilAtual.chave === `federais/${b}`;
  if (mesmoPerfil) { perfilAtual.trocarAba(c); return; }
  const token = ++rotaToken;
  perfilAtual = null;
  window.scrollTo(0, 0);

  if (a === 'metodologia') { marcarMenu('metodologia'); return viewMetodologia(); }
  if (a === 'fontes') { marcarMenu('fontes'); return viewFontes(); }

  marcarMenu('inicio');
  if (!a) return viewCargo('federais', token, true);
  if (!CARGOS[a]) return viewCargo('federais', token, true);
  if (a === 'federais') {
    if (/^\d+$/.test(b || '')) return viewPerfil('federais', '', b, c, token);
    return viewCargo('federais', token, false);
  }
  if (b && c && UFS.includes(b)) return viewPerfil(a, b, c, d, token);
  return viewCargo(a, token, false);
}

(async function iniciar() {
  try {
    await iniciarDados();
  } catch (e) {
    console.error(e);
    mostrar(app, html`<div class="erro" role="alert"><strong>Não foi possível iniciar o aplicativo.</strong><p>Recarregue a página. Se o problema continuar, tente de novo mais tarde.</p></div>`);
    return;
  }
  montarFaixas();
  window.addEventListener('hashchange', rota);
  rota();
})();

</script>
