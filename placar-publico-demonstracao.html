<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Placar Público (demonstração)</title>
  <meta name="description" content="A nota de deputados, governadores, prefeitos e vereadores do Brasil, calculada só com dados oficiais abertos e atualizada todo dia.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%232a3f9b' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%232a3f9b'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
/* =====================================================================
   Placar Público — estilos
   Layout do De Olho na Câmara: uma coluna central, faixa de números,
   abas e um painel por aba. Todas as cores vêm das variáveis abaixo
   (claro e escuro).
   ===================================================================== */

:root {
  --bg: #f3f5f8;
  --superficie: #ffffff;
  --tinta: #15202b;
  --tinta-2: #4b5d6e;
  --linha: #d8dfe6;
  --linha-forte: #b9c4cf;

  --acento: #2a3f9b;
  --acento-fundo: #e8ecfa;

  --sim: #17724a;   --sim-fundo: #e1f2e9;
  --nao: #ab2f29;   --nao-fundo: #fae8e6;
  --abst: #84590a;  --abst-fundo: #faefd6;
  --neutro: #4f6070; --neutro-fundo: #e8ecf0;

  --alta: #17724a;  --alta-fundo: #e1f2e9;
  --media: #84590a; --media-fundo: #faefd6;
  --baixa: #ab2f29; --baixa-fundo: #fae8e6;
  --aviso: #7a4b00; --aviso-fundo: #fff4d6; --aviso-linha: #e2b34a;

  --fonte-texto: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fonte-dados: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --raio: 6px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1419;
    --superficie: #171f26;
    --tinta: #e6ecf1;
    --tinta-2: #9fb0bf;
    --linha: #2a3640;
    --linha-forte: #3c4a56;

    --acento: #93a7ff;
    --acento-fundo: #1d2646;

    --sim: #5cd39b;   --sim-fundo: #12301f;
    --nao: #ff918a;   --nao-fundo: #3a1b19;
    --abst: #f0c25f;  --abst-fundo: #35290c;
    --neutro: #9fb0bf; --neutro-fundo: #222d36;

    --alta: #5cd39b;  --alta-fundo: #12301f;
    --media: #f0c25f; --media-fundo: #35290c;
    --baixa: #ff918a; --baixa-fundo: #3a1b19;
    --aviso: #f0c25f; --aviso-fundo: #2e2410; --aviso-linha: #7a5d1c;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--tinta);
  font: 400 16px/1.5 var(--fonte-texto);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

a { color: var(--acento); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 3px solid var(--acento);
  outline-offset: 2px;
}
h1, h2, h3 { text-wrap: balance; line-height: 1.2; margin: 0; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }

.cx {
  width: 100%;
  max-width: 1080px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Topo e rodapé ---------- */
.topo {
  background: var(--superficie);
  border-bottom: 1px solid var(--linha);
  position: sticky;
  top: 0;
  z-index: 5;
}
.topo-in {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px 24px;
  flex-wrap: wrap;
  padding-block: 12px;
}
.marca {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 1.125rem;
  letter-spacing: -0.01em;
  color: var(--tinta);
  text-decoration: none;
}
.marca-sinal {
  width: 20px; height: 20px;
  border: 3px solid var(--acento);
  border-radius: 50%;
  position: relative;
}
.marca-sinal::after {
  content: "";
  position: absolute;
  inset: 3px;
  background: var(--acento);
  border-radius: 50%;
}
.topo-nota { color: var(--tinta-2); font-size: .875rem; }

.miolo { flex: 1; padding-block: 28px 56px; outline: none; }

.rodape { border-top: 1px solid var(--linha); background: var(--superficie); }
.rodape p { color: var(--tinta-2); font-size: .8125rem; padding-block: 16px; max-width: 70ch; }

/* ---------- Página inicial ---------- */
.hero { display: grid; gap: 8px; margin-bottom: 20px; max-width: 62ch; }
.hero h1 { font-size: clamp(1.5rem, 1.1rem + 1.8vw, 2.1rem); letter-spacing: -0.02em; }
.hero p { color: var(--tinta-2); }

.filtros {
  display: grid;
  grid-template-columns: minmax(0, 2fr) repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 12px;
}
.campo { display: grid; gap: 4px; min-width: 0; }
.campo > span { font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--tinta-2); }
input[type="search"], select {
  width: 100%;
  min-height: 44px;
  padding: 8px 12px;
  font: inherit;
  color: var(--tinta);
  background: var(--superficie);
  border: 1px solid var(--linha-forte);
  border-radius: var(--raio);
}
.contagem { color: var(--tinta-2); font-size: .875rem; margin-bottom: 16px; min-height: 1.4em; }

.grade {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 10px;
}
.dep {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr);
  grid-template-rows: auto auto;
  column-gap: 12px;
  align-content: center;
  padding: 10px;
  min-height: 84px;
  background: var(--superficie);
  border: 1px solid var(--linha);
  border-radius: var(--raio);
  color: var(--tinta);
  text-decoration: none;
}
.dep:hover { border-color: var(--acento); }
.dep .foto { grid-row: 1 / span 2; width: 52px; height: 64px; align-self: center; }
.dep-nome { font-weight: 600; align-self: end; overflow-wrap: anywhere; }
.dep-meta { font-family: var(--fonte-dados); font-size: .8125rem; color: var(--tinta-2); align-self: start; }
.vazio { grid-column: 1 / -1; padding: 28px 0; color: var(--tinta-2); }

.foto { display: block; object-fit: cover; background: var(--neutro-fundo); border-radius: 4px; }
.foto.sem-foto { opacity: 0; }

/* ---------- Perfil ---------- */
.voltar { display: inline-block; margin-bottom: 16px; font-size: .9375rem; }

.perfil-topo {
  display: grid;
  grid-template-columns: 112px minmax(0, 1fr);
  gap: 20px;
  align-items: start;
  margin-bottom: 20px;
}
.perfil-topo .foto { width: 112px; height: 149px; }
.perfil-nome { font-size: clamp(1.5rem, 1.1rem + 1.8vw, 2.1rem); letter-spacing: -0.02em; overflow-wrap: anywhere; }
.perfil-civil { color: var(--tinta-2); font-size: .875rem; margin-top: 2px; overflow-wrap: anywhere; }
.etiquetas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.etq {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: .8125rem;
  font-weight: 600;
  background: var(--acento-fundo);
  color: var(--acento);
}
.etq.neutra { background: var(--neutro-fundo); color: var(--neutro); }
.perfil-link { margin-top: 10px; font-size: .9375rem; }

.ficha {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 10px 24px;
  margin-top: 16px;
}
.ficha div { min-width: 0; }
.ficha dt { font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--tinta-2); }
.ficha dd { margin: 0; overflow-wrap: anywhere; }
.ficha { margin-bottom: 0; }
dl.ficha { margin-block: 16px 24px; }
.redes { display: flex; flex-wrap: wrap; gap: 4px 12px; }

/* Faixa de números */
.numeros {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px;
  margin-bottom: 24px;
}
.stat {
  display: grid;
  gap: 2px;
  padding: 14px 16px;
  background: var(--superficie);
  border: 1px solid var(--linha);
  border-radius: var(--raio);
  color: var(--tinta);
  text-decoration: none;
  min-width: 0;
}
.stat:hover, .stat[aria-current="true"] { border-color: var(--acento); }
.stat-rotulo { font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--tinta-2); }
.stat-valor { font-family: var(--fonte-dados); font-size: 1.5rem; font-weight: 500; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat-legenda { font-size: .8125rem; color: var(--tinta-2); }

/* Abas */
.barra-abas {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 8px 16px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--linha);
  margin-bottom: 20px;
}
.abas { display: flex; overflow-x: auto; max-width: 100%; }
.aba {
  padding: 10px 16px;
  color: var(--tinta-2);
  font-weight: 500;
  text-decoration: none;
  border-bottom: 3px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
}
.aba:hover { color: var(--tinta); }
.aba[aria-selected="true"] { color: var(--tinta); font-weight: 700; border-bottom-color: var(--acento); }
.seletor-ano { display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
.seletor-ano span { font-size: .875rem; color: var(--tinta-2); }
.seletor-ano select { width: auto; min-height: 36px; padding-block: 4px; }

.painel { min-height: 240px; }
.painel-titulo { font-size: 1.125rem; margin-bottom: 4px; }
.painel-sub { color: var(--tinta-2); font-size: .9375rem; margin-bottom: 16px; max-width: 70ch; }
.nota {
  color: var(--tinta-2);
  font-size: .875rem;
  max-width: 70ch;
  margin-top: 16px;
  padding-left: 12px;
  border-left: 3px solid var(--linha-forte);
}
.secao { margin-top: 32px; }
.secao h3 { font-size: 1rem; margin-bottom: 12px; }

/* Filtros dentro de painéis */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip {
  min-height: 36px;
  padding: 4px 12px;
  font: inherit;
  font-size: .875rem;
  color: var(--tinta);
  background: var(--superficie);
  border: 1px solid var(--linha-forte);
  border-radius: 999px;
  cursor: pointer;
}
.chip b { font-family: var(--fonte-dados); font-weight: 500; margin-left: 4px; color: var(--tinta-2); }
.chip[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: var(--superficie); }
.chip[aria-pressed="true"] b { color: inherit; }
.painel .busca { max-width: 420px; margin-bottom: 8px; }
.tipos-linha { color: var(--tinta-2); font-size: .8125rem; margin-bottom: 16px; }
.tipos-linha abbr { text-decoration: underline dotted; cursor: help; font-family: var(--fonte-dados); }

/* Lista de proposições */
.prop {
  padding: 14px 0;
  border-top: 1px solid var(--linha);
  display: grid;
  gap: 6px;
}
.prop:last-child { border-bottom: 1px solid var(--linha); }
.prop-cab { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.prop-id { font-family: var(--fonte-dados); font-weight: 500; }
.prop-tipo { color: var(--tinta-2); font-size: .875rem; }
.prop-data { margin-left: auto; font-family: var(--fonte-dados); font-size: .8125rem; color: var(--tinta-2); }
.prop-texto { max-width: 80ch; overflow-wrap: anywhere; }
.prop-texto.curto {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.prop-links { display: flex; gap: 16px; font-size: .875rem; }
.link-botao {
  padding: 0; border: 0; background: none; font: inherit; font-size: .875rem;
  color: var(--acento); text-decoration: underline; cursor: pointer;
}
.mais-itens { margin-top: 16px; }
.botao {
  min-height: 44px; padding: 8px 18px; font: inherit; font-weight: 600;
  color: var(--acento); background: var(--superficie);
  border: 1px solid var(--acento); border-radius: var(--raio); cursor: pointer;
}

/* Votos */
.pilha { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--neutro-fundo); margin: 8px 0 12px; }
.pilha span { display: block; min-width: 3px; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .875rem; margin-bottom: 20px; }
.legenda li { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.legenda b { font-family: var(--fonte-dados); font-weight: 500; }

.cor-sim { background: var(--sim); }
.cor-nao { background: var(--nao); }
.cor-abst { background: var(--abst); }
.cor-obstr, .cor-art17, .cor-secreto, .cor-outro { background: var(--neutro); }
.cor-ausente { background: var(--linha-forte); }

.voto-linha {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px 20px;
  padding: 14px 0;
  border-top: 1px solid var(--linha);
}
.voto-linha:last-child { border-bottom: 1px solid var(--linha); }
.voto-cab { font-family: var(--fonte-dados); font-size: .8125rem; color: var(--tinta-2); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.voto-desc { overflow-wrap: anywhere; max-width: 80ch; }
.voto-prop { font-size: .875rem; color: var(--tinta-2); max-width: 80ch; overflow-wrap: anywhere; }
.voto-prop strong { color: var(--tinta); font-family: var(--fonte-dados); font-weight: 500; }
.placar { font-family: var(--fonte-dados); font-size: .8125rem; color: var(--tinta-2); }
.pill {
  align-self: start;
  padding: 3px 12px;
  border-radius: 999px;
  font-size: .8125rem;
  font-weight: 700;
  white-space: nowrap;
  background: var(--neutro-fundo);
  color: var(--neutro);
}
.pill.v-sim { background: var(--sim-fundo); color: var(--sim); }
.pill.v-nao { background: var(--nao-fundo); color: var(--nao); }
.pill.v-abst { background: var(--abst-fundo); color: var(--abst); }
.pill.v-ausente { background: transparent; border: 1px dashed var(--linha-forte); color: var(--tinta-2); font-weight: 600; }

/* Presença */
.pres-num { font-size: 1.125rem; }
.pres-num strong { font-family: var(--fonte-dados); font-size: 2rem; font-weight: 500; }
.pres-num .pct { margin-left: 8px; font-family: var(--fonte-dados); color: var(--tinta-2); }
.barra { height: 16px; border-radius: 4px; background: var(--nao-fundo); overflow: hidden; margin: 12px 0; max-width: 640px; }
.barra span { display: block; height: 100%; background: var(--acento); }
.pres-leg { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: .9375rem; }
.pres-leg li { display: inline-flex; align-items: center; gap: 8px; }
.pres-leg i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.pres-leg .ok { background: var(--acento); }
.pres-leg .falta { background: var(--nao-fundo); border: 1px solid var(--nao); }
details.datas { margin-top: 20px; max-width: 70ch; }
details.datas summary { cursor: pointer; font-weight: 600; }
.lista-datas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.lista-datas li { font-family: var(--fonte-dados); font-size: .8125rem; padding: 2px 8px; background: var(--neutro-fundo); border-radius: 4px; }

/* Gastos */
.gasto-total { font-family: var(--fonte-dados); font-size: 2rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.hb { display: grid; gap: 10px; max-width: 820px; }
.hb li {
  display: grid;
  grid-template-columns: minmax(8rem, 15rem) minmax(0, 1fr) 8.5rem;
  gap: 4px 16px;
  align-items: center;
}
.hb-rot { overflow-wrap: anywhere; font-size: .9375rem; }
.hb-barra { height: 10px; border-radius: 3px; background: var(--neutro-fundo); overflow: hidden; }
.hb-barra span { display: block; height: 100%; background: var(--acento); }
.hb-valor { font-family: var(--fonte-dados); font-size: .875rem; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hb li.futuro .hb-rot, .hb li.futuro .hb-valor { color: var(--tinta-2); }

.lanc { display: grid; gap: 0; max-width: 820px; }
.lanc li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 10px 0; border-top: 1px solid var(--linha); }
.lanc li:last-child { border-bottom: 1px solid var(--linha); }
.lanc-forn { font-weight: 600; overflow-wrap: anywhere; }
.lanc-meta { color: var(--tinta-2); font-size: .8125rem; overflow-wrap: anywhere; }
.lanc-valor { font-family: var(--fonte-dados); text-align: right; white-space: nowrap; }

/* Carregando e erros */
.esq {
  background: linear-gradient(90deg, var(--neutro-fundo) 25%, var(--linha) 50%, var(--neutro-fundo) 75%);
  background-size: 300% 100%;
  animation: brilho 1.4s linear infinite;
  border-radius: 4px;
}
@keyframes brilho { from { background-position: 100% 0; } to { background-position: 0 0; } }
.esq-linha { height: 18px; margin-bottom: 12px; }
.esq-card { height: 84px; }
.progresso { color: var(--tinta-2); margin-bottom: 16px; font-size: .9375rem; }
.erro {
  display: grid; gap: 10px; justify-items: start;
  padding: 18px 20px;
  background: var(--nao-fundo);
  border: 1px solid var(--nao);
  border-radius: var(--raio);
  max-width: 70ch;
}
.erro strong { color: var(--nao); }

@media (prefers-reduced-motion: reduce) {
  .esq { animation: none; }
}

/* =====================================================================
   Placar Público: o que foi acrescentado ao layout do De Olho na Câmara
   ===================================================================== */

/* Topo com menu */
.topo-in { flex-wrap: wrap; align-items: center; }
.menu { display: flex; gap: 4px 18px; flex-wrap: wrap; font-size: .9375rem; }
.menu a { color: var(--tinta-2); text-decoration: none; padding: 6px 0; border-bottom: 2px solid transparent; }
.menu a:hover, .menu a[aria-current="page"] { color: var(--tinta); border-bottom-color: var(--acento); }

/* Faixa de aviso (modo demonstração, falha de atualização) */
.faixa { border-bottom: 1px solid var(--aviso-linha); background: var(--aviso-fundo); color: var(--aviso); font-size: .875rem; }
.faixa .cx { padding-block: 8px; }
.faixa strong { font-weight: 700; }
.faixa-demo { background: var(--nao-fundo); color: var(--nao); border-bottom-color: var(--nao); }

/* Abas de cargo */
.cargos {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 20px;
}
.cargo-aba {
  display: grid; gap: 2px; align-content: start;
  padding: 10px 12px;
  background: var(--superficie);
  border: 1px solid var(--linha);
  border-radius: var(--raio);
  color: var(--tinta);
  text-decoration: none;
  min-width: 0;
}
.cargo-aba:hover { border-color: var(--acento); }
.cargo-aba[aria-current="page"] { border-color: var(--acento); box-shadow: inset 0 -3px 0 var(--acento); }
.cargo-nome { font-weight: 700; font-size: .9375rem; line-height: 1.25; }
.cargo-info { font-family: var(--fonte-dados); font-size: .75rem; color: var(--tinta-2); }

/* Nota */
.nota-num {
  display: inline-grid; place-items: center;
  min-width: 3.6rem; padding: 4px 8px;
  border-radius: var(--raio);
  font-family: var(--fonte-dados); font-weight: 500; font-size: 1.125rem;
  font-variant-numeric: tabular-nums;
  background: var(--neutro-fundo); color: var(--neutro);
}
.nota-num small { font-size: .625rem; letter-spacing: .04em; text-transform: uppercase; font-family: var(--fonte-texto); font-weight: 600; }
.n-alta { background: var(--alta-fundo); color: var(--alta); }
.n-media { background: var(--media-fundo); color: var(--media); }
.n-baixa { background: var(--baixa-fundo); color: var(--baixa); }
.nota-grande { min-width: 6.5rem; font-size: 2.75rem; padding: 8px 14px; line-height: 1.05; }

/* Perfil: nota e componentes */

        A nota resume critérios objetivos e não aponta irregularidade: leia a <a href="#/metodologia">Metodologia</a>.
      </p>

  </footer>

  <script>
'use strict';

/* =====================================================================
   Placar Público — base
   Configuração, utilitários, leitura dos arquivos de dados e o modo
   demonstração (dados fictícios, para quando o site é aberto sem os
   arquivos reais).

   Ordem dos arquivos no index.html:
     base.js → demo.js → ao-vivo.js → telas.js → roteador.js
   ===================================================================== */

/* ---------- 1. Configuração ---------- */

const API = 'https://dadosabertos.camara.leg.br/api/v2';
const PORTAL = 'https://www.camara.leg.br';
const ID_PLENARIO = 180;        // código do Plenário na API
const ANO_ATUAL = new Date().getFullYear();
const PRIMEIRO_ANO = 2023;      // início da legislatura atual
const JANELAS_VOTACOES = 4;     // 4 janelas de ~3 meses = últimos 12 meses
const DIAS_JANELA = 89;         // a API recusa intervalos maiores que 3 meses

const UFS = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
const NOMES_UF = { AC:'Acre', AL:'Alagoas', AP:'Amapá', AM:'Amazonas', BA:'Bahia', CE:'Ceará', DF:'Distrito Federal', ES:'Espírito Santo', GO:'Goiás', MA:'Maranhão', MT:'Mato Grosso', MS:'Mato Grosso do Sul', MG:'Minas Gerais', PA:'Pará', PB:'Paraíba', PR:'Paraná', PE:'Pernambuco', PI:'Piauí', RJ:'Rio de Janeiro', RN:'Rio Grande do Norte', RS:'Rio Grande do Sul', RO:'Rondônia', RR:'Roraima', SC:'Santa Catarina', SP:'São Paulo', SE:'Sergipe', TO:'Tocantins' };

/* Os cinco cargos. "nota: true" = existe nota calculada com dados oficiais. */
const CARGOS = {
  federais: {
    rotulo: 'Deputados federais', singular: 'Deputado federal', nota: true,
    lead: 'Presença no Plenário, votos, projetos e uso da cota parlamentar. Os números vêm dos dados abertos da Câmara e são recalculados todo dia.'
  },
  governadores: {
    rotulo: 'Governadores', singular: 'Governador(a)', nota: true,
    lead: 'A nota olha as contas do governo estadual: gasto com pessoal, dívida e relatórios fiscais entregues ao Tesouro Nacional.'
  },
  prefeitos: {
    rotulo: 'Prefeitos', singular: 'Prefeito(a)', nota: true,
    lead: 'A nota olha as contas da prefeitura: gasto com pessoal, dívida e relatórios fiscais entregues ao Tesouro Nacional.'
  },
  estaduais: {
    rotulo: 'Deputados estaduais', singular: 'Deputado(a) estadual', nota: false,
    lead: 'Lista dos eleitos de cada estado (e do Distrito Federal). A nota ainda não existe: veja o motivo abaixo.'
  },
  vereadores: {
    rotulo: 'Vereadores', singular: 'Vereador(a)', nota: false,
    lead: 'Lista dos vereadores eleitos em cada município. A nota ainda não existe: veja o motivo abaixo.'
  }
};
// Tipos de proposição: PL, PEC etc. As siglas fora desta lista aparecem como vieram da API.
const NOMES_TIPO = {
  PL: 'Projeto de Lei', PLP: 'Projeto de Lei Complementar', PEC: 'Proposta de Emenda à Constituição',
  PDL: 'Projeto de Decreto Legislativo', PRC: 'Projeto de Resolução', MPV: 'Medida Provisória',
  PLV: 'Projeto de Lei de Conversão', PLN: 'Projeto de Lei do Congresso', PFC: 'Proposta de Fiscalização e Controle',
  REQ: 'Requerimento', RIC: 'Requerimento de Informação', INC: 'Indicação', RCP: 'Requerimento de CPI',
  EMC: 'Emenda', EMP: 'Emenda de Plenário', EMD: 'Emenda', SBT: 'Substitutivo', PRL: 'Parecer de Relator',
  PAR: 'Parecer', DTQ: 'Destaque', REL: 'Relatório', MSC: 'Mensagem', OFI: 'Ofício'
};
const SIGLAS_PROJETO = new Set(['PL', 'PLP', 'PEC', 'PDL', 'PRC', 'MPV', 'PLV', 'PLN', 'PFC']);
const SIGLAS_REQUERIMENTO = new Set(['REQ', 'RIC', 'INC', 'RCP']);

const ORDEM_CARGOS = ['federais', 'governadores', 'prefeitos', 'estaduais', 'vereadores'];

/* ---------- 2. Utilitários ---------- */

const $ = (seletor, raiz = document) => raiz.querySelector(seletor);
const $$ = (seletor, raiz = document) => [...raiz.querySelectorAll(seletor)];
const esperar = ms => new Promise(r => setTimeout(r, ms));
const app = $('#app');

// Todo texto vindo da API passa por esc() antes de entrar no HTML.
const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = v => (v === false || v == null ? '' : String(v)).replace(/[&<>"']/g, c => ESCAPES[c]);
class Html { constructor(s) { this.s = s; } }
function html(partes, ...valores) {
  let saida = '';
  partes.forEach((p, i) => {
    saida += p;
    if (i < valores.length) {
      const lista = Array.isArray(valores[i]) ? valores[i] : [valores[i]];
      saida += lista.map(x => (x instanceof Html ? x.s : esc(x))).join('');
    }
  });
  return new Html(saida);
}
const mostrar = (el, conteudo) => { el.innerHTML = conteudo.s; };

const urlSegura = u => (/^https?:\/\//i.test(u || '') ? u : '');
const semAcento = s => (s || '').normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
const fmtBRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtNum = new Intl.NumberFormat('pt-BR');
const plural = (n, um, varios) => `${fmtNum.format(n)} ${n === 1 ? um : varios}`;

function dataBR(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  return m ? `${m[3]}/${m[2]}/${m[1]}` : '';
}
const doisDigitos = n => String(n).padStart(2, '0');
const isoDia = d => `${d.getFullYear()}-${doisDigitos(d.getMonth() + 1)}-${doisDigitos(d.getDate())}`;
const somarDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

function reaisCurto(v) {
  const a = Math.abs(v), sinal = v < 0 ? '-' : '';
  const f = x => x.toLocaleString('pt-BR', { maximumFractionDigits: 1 });
  if (a >= 1e6) return `${sinal}R$ ${f(a / 1e6)} mi`;
  if (a >= 1e3) return `${sinal}R$ ${f(a / 1e3)} mil`;
  return `${sinal}R$ ${Math.round(a)}`;
}

// "PASSAGEM AÉREA - SIGEPA." -> "Passagem aérea - SIGEPA"
const SIGLAS_DESPESA = new Set(['SIGEPA', 'RPA', 'DF', 'CEAP', 'TV']);
function frase(s) {
  const t = (s || '').trim().replace(/\.+$/, '').toLowerCase()
    .replace(/[a-z]+/g, p => (SIGLAS_DESPESA.has(p.toUpperCase()) ? p.toUpperCase() : p));
  return t.charAt(0).toUpperCase() + t.slice(1);
}


/* Requisições: com repetição automática e memória (a mesma URL não é buscada duas vezes). */
const memoria = new Map();
function getJSON(caminho, { vazioSe404 = false, repetir = true } = {}) {
  const url = caminho.startsWith('http') ? caminho : API + caminho;
  const maxRepeticoes = repetir ? 3 : 0;   // a API às vezes derruba uma conexão; tentar de novo resolve
  if (memoria.has(url)) return memoria.get(url);
  const promessa = (async () => {
    for (let tentativa = 0; ; tentativa++) {
      try {
        const r = await fetch(url, { headers: { Accept: 'application/json' } });
        if (r.status === 404 && vazioSe404) return { dados: [], links: [] };
        if (r.status >= 500 && tentativa < maxRepeticoes) { await esperar(700 * (tentativa + 1)); continue; }
        if (!r.ok) throw new Error(`HTTP ${r.status} em ${url}`);
        return await r.json();
      } catch (e) {
        if (tentativa < maxRepeticoes && !/^HTTP /.test(e.message)) { await esperar(700 * (tentativa + 1)); continue; }
        throw e;
      }
    }
  })();
  memoria.set(url, promessa);
  promessa.catch(() => memoria.delete(url));
  return promessa;
}

// Executa fn em todos os itens, no máximo `limite` ao mesmo tempo, mantendo a ordem.
async function emLotes(itens, limite, fn) {
  const resultados = new Array(itens.length);
  let proximo = 0;
  async function trabalhador() {
    while (proximo < itens.length) {
      const k = proximo++;
      resultados[k] = await fn(itens[k], k);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limite, itens.length) }, trabalhador));
  return resultados;
}

// Busca todas as páginas de uma lista (100 itens por página).
async function buscarTudo(caminho, maxPaginas = 15) {
  const sep = caminho.includes('?') ? '&' : '?';
  const url = p => `${caminho}${sep}itens=100&pagina=${p}`;
  const primeira = await getJSON(url(1));
  const ultima = (primeira.links || []).find(l => l.rel === 'last');
  const total = ultima ? Number((/[?&]pagina=(\d+)/.exec(ultima.href) || [])[1]) || 1 : 1;
  const n = Math.min(total, maxPaginas);
  const outras = await emLotes(Array.from({ length: n - 1 }, (_, i) => i + 2), 4, p => getJSON(url(p)));
  return { itens: [primeira, ...outras].flatMap(r => r.dados || []), truncado: total > maxPaginas };
}

const nf1 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtNota = n => (n == null ? '—' : nf1.format(n));
const faixaNota = n => (n == null ? 'sem' : n >= 70 ? 'alta' : n >= 40 ? 'media' : 'baixa');
const rotuloFaixa = n => ({ alta: 'nota alta', media: 'nota média', baixa: 'nota baixa', sem: 'sem nota' })[faixaNota(n)];

function dataHoraBR(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short', timeZone: 'America/Sao_Paulo' });
}

const iniciais = nome => {
  const p = String(nome || '?').trim().split(/\s+/).filter(x => x.length > 2 || /^[A-ZÀ-Ý]/.test(x));
  return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
};

// Escolhas pequenas guardadas no navegador (se ele permitir): ano e estado.
function lerPref(chave, padrao) {
  try { const v = localStorage.getItem('placar-' + chave); return v == null ? padrao : v; } catch (e) { return padrao; }
}
function salvarPref(chave, valor) { try { localStorage.setItem('placar-' + chave, String(valor)); } catch (e) { /* sem armazenamento: ignora */ } }
function lerAno() {
  const a = Number(lerPref('ano', ANO_ATUAL));
  return a >= PRIMEIRO_ANO && a <= ANO_ATUAL ? a : ANO_ATUAL;
}
function salvarAno(a) { salvarPref('ano', a); }

/* ---------- 3. Arquivos de dados ---------- */

/* Os dados reais ficam na pasta "dados", gerados todo dia pela rotina do GitHub.
   Se a pasta não existir (site aberto direto do computador, ou primeira rotina
   ainda não terminou), o site entra em modo demonstração, com dados inventados. */
const DADOS = { base: 'dados/', demo: false, motivoDemo: '', cache: new Map(), meta: null, metodo: null };

function lerArquivo(nome) {
  if (DADOS.cache.has(nome)) return DADOS.cache.get(nome);
  const promessa = (async () => {
    if (DADOS.demo) return gerarDemo(nome);
    const r = await fetch(DADOS.base + nome, { cache: 'no-cache' });
    if (!r.ok) throw new Error(`HTTP ${r.status} em ${nome}`);
    return r.json();
  })();
  DADOS.cache.set(nome, promessa);
  promessa.catch(() => DADOS.cache.delete(nome));
  return promessa;
}

async function iniciarDados() {
  try {
    // Abrindo o arquivo direto do computador (file://), o navegador não deixa ler a pasta "dados".
    if (location.protocol === 'file:') throw new Error('arquivo local');
    DADOS.meta = await lerArquivo('meta.json');
  } catch (e) {
    DADOS.demo = true;
    DADOS.motivoDemo = location.protocol === 'file:' ? 'arquivo-local' : 'sem-dados';
    DADOS.cache.clear();
    DADOS.meta = await lerArquivo('meta.json');
  }
  try { DADOS.metodo = await lerArquivo('metodo.json'); } catch (e) { DADOS.metodo = null; }
}

/* ---------- 4. Peças de tela comuns ---------- */

const estado = { ano: lerAno(), filtros: {}, uf: lerPref('uf', 'SP') };

'use strict';

/* =====================================================================
   Placar Público — modo demonstração
   TUDO AQUI É INVENTADO. Serve só para mostrar como o site fica quando

   ===================================================================== */

const DEMO = { pronto: false };

function aleatorio(semente) {
  let a = semente >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const DEMO_PRIMEIROS = ['Ana', 'Bruno', 'Carla', 'Diego', 'Elisa', 'Fábio', 'Gabriela', 'Hugo', 'Iara', 'João', 'Karina', 'Luís', 'Marta', 'Nelson', 'Olívia', 'Paulo', 'Rita', 'Sérgio', 'Tânia', 'Ulisses', 'Vera', 'Wagner', 'Yara', 'Zeca'];
const DEMO_SOBRENOMES = ['Exemplo', 'Amostra', 'Modelo', 'Teste', 'Ilustrativo', 'Fictício', 'Simulado', 'Demonstrativo'];
const DEMO_PARTIDOS = ['ALFA', 'BETA', 'GAMA', 'DELTA', 'SIGMA', 'ZETA', 'TETA'];
const DEMO_PREFIXOS = ['São', 'Santa', 'Vila', 'Nova', 'Porto', 'Alto', 'Bela', 'Campo'];
const DEMO_BASES = ['Exemplo', 'Amostra', 'Modelo', 'Teste', 'Ficção', 'Demo', 'Simula', 'Mostra', 'Ilustra', 'Esboço'];
const DEMO_INSTRUCAO = ['Superior completo', 'Ensino médio completo', 'Ensino fundamental completo', 'Superior incompleto'];
const DEMO_OCUPACAO = ['Advogado', 'Empresário', 'Professor', 'Servidor público', 'Comerciante', 'Médico', 'Agricultor', 'Engenheiro'];
const DEMO_BANCADA = { SP: 70, MG: 53, RJ: 46, BA: 39, RS: 31, PR: 30, PE: 25, CE: 22, MA: 18, PA: 17, GO: 17, SC: 16, PB: 12, ES: 10, PI: 10, AL: 9, AM: 8, MT: 8, RN: 8, DF: 8, MS: 8, SE: 8, RO: 8, TO: 8, AC: 8, AP: 8, RR: 8 };

function demoPessoa(r, extra = {}) {
  const pick = lista => lista[Math.floor(r() * lista.length)];
  const nome = `${pick(DEMO_PRIMEIROS)} ${String.fromCharCode(65 + Math.floor(r() * 26))}. ${pick(DEMO_SOBRENOMES)}`;
  return {
    nome, urna: nome.split(' ')[0], partido: pick(DEMO_PARTIDOS), situacao: 'Eleito',
    idade: 28 + Math.floor(r() * 45), instrucao: pick(DEMO_INSTRUCAO), ocupacao: pick(DEMO_OCUPACAO), ...extra
  };
}

function demoPosicoes(itens) {
  const com = itens.filter(i => i.nota != null).sort((a, b) => b.nota - a.nota || a.nome.localeCompare(b.nome, 'pt-BR'));
  com.forEach((i, k) => { i.rank = k + 1; });
  itens.filter(i => i.nota == null).forEach(i => { i.rank = null; });
  return com.length;
}

const demoMedia = itens => {
  const v = itens.filter(i => i.nota != null).map(i => i.nota);
  return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length * 10) / 10 : null;
};
const demoNota = (comp, pesos) => {
  const soma = comp.reduce((a, c) => a + pesos[c.k], 0);
  return Math.round(comp.reduce((a, c) => a + c.s * pesos[c.k], 0) / soma * 10) / 10;
};
const demoRound = x => Math.round(x * 10) / 10;
const demoPct = n => n.toLocaleString('pt-BR');

function demoConstruir() {
  if (DEMO.pronto) return;
  const r = aleatorio(20261118);
  const SESSOES = 118, VOTACOES = 64;

  /* Deputados federais */
  const federais = [];
  let contador = 900000;
  for (const uf of UFS) {
    for (let i = 0; i < DEMO_BANCADA[uf]; i++) {
      const p = demoPessoa(r, { id: String(++contador), uf });
      const pres = demoRound(100 - Math.pow(r(), 1.7) * 85);
      const vot = demoRound(100 - Math.pow(r(), 1.8) * 80);
      const proj = demoRound(r() * 100);
      const cota = demoRound(r() * 100);
      const nProj = Math.round(proj / 100 * 40);
      const gasto = Math.round(60000 + (100 - cota) / 100 * 700000);
      const item = {
        id: p.id, nome: p.nome, partido: p.partido, uf,
        desde: '2026-02-03',
        comp: [
          { k: 'pres', s: pres, f: `Presente em ${Math.round(pres / 100 * SESSOES)} de ${SESSOES} sessões deliberativas do Plenário em 2026 (${Math.round(pres)}%).` },
          { k: 'vot', s: vot, f: `Registrou voto em ${Math.round(vot / 100 * VOTACOES)} de ${VOTACOES} votações nominais do Plenário em 2026.` },
          { k: 'proj', s: proj, f: `Apresentou ${nProj} projetos e propostas, mais do que ${Math.floor(proj)}% dos deputados.` },
          { k: 'cota', s: cota, f: `Gastou R$ ${demoPct(gasto)} da cota em 2026, menos do que ${Math.floor(100 - cota)}% dos colegas de ${uf}.` }
        ]
      };
      item.nota = demoNota(item.comp, { pres: 30, vot: 25, proj: 20, cota: 25 });
      federais.push(item);
    }
  }
  [4, 120, 301].forEach((k, n) => {
    federais[k].nota = null; federais[k].comp = [];
    federais[k].motivo = n === 0 ? 'Só 12 sessões deliberativas desde a primeira presença (03/09/2026); o mínimo é 20.' : 'Sem presença registrada em sessões deliberativas do Plenário em 2026.';
  });
  const fedCom = demoPosicoes(federais);

  /* Prefeitos e governadores */
  const executivo = (r2, esfera) => {
    const limP = esfera === 'M' ? 54 : 49, limD = esfera === 'M' ? 120 : 200;
    const pessoal = demoRound(limP * (0.55 + r2() * 0.6));
    const divida = demoRound(limD * (r2() * 0.9) - (r2() < 0.2 ? limD * 0.2 : 0));
    const feitas = r2() < 0.8 ? 10 : 6 + Math.floor(r2() * 4);

      { k: 'entregas', s: sE, f: `Entregou ${feitas} dos 10 relatórios fiscais obrigatórios de 2025 ao Tesouro Nacional.` }
    ];
    return { comp, nota: demoNota(comp, { pessoal: 40, divida: 30, entregas: 30 }) };

  const todosPref = [];
  let cp = 800000000;
  for (const uf of UFS) {

      else Object.assign(p, executivo(r, 'M'));
      prefeitos[uf].push(p);
      todosPref.push(p);
    }
  }
  const prefCom = demoPosicoes(todosPref);

  const governadores = UFS.map(uf => {
    const g = demoPessoa(r, { id: String(700000 + UFS.indexOf(uf)), uf, ibge: 10 + UFS.indexOf(uf), populacao: Math.round(500000 + r() * 40000000) });
    return Object.assign(g, executivo(r, uf === 'DF' ? 'D' : 'E'));

  const agora = new Date().toISOString();

  DEMO.federais = { ano: 2026, geradoEm: agora, sessoes: SESSOES, votacoes: VOTACOES, total: federais.length, comNota: fedCom, media: demoMedia(federais), itens: federais };
  DEMO.prefeitos = prefeitos;
  DEMO.ranking = { ano: 2024, exercicio: 2025, total: todosPref.length, comNota: prefCom, itens: todosPref.map(compacto) };
  DEMO.governadores = { ano: 2022, exercicio: 2025, total: governadores.length, comNota: govCom, itens: governadores };
  DEMO.estaduais = {};
  DEMO.vereadores = {};
  DEMO.meta = {
    versao: 1, geradoEm: agora, demo: true,
    fontes: {
      camara: { ok: true, atualizadoEm: agora, ano: 2026, sessoes: SESSOES, votacoes: VOTACOES },
      tse: { ok: true, atualizadoEm: agora, eleicoes: { municipal: 2024, governadores: 2022, estaduais: 2022 }, avisos: 0 },
      siconfi: { ok: true, atualizadoEm: agora, exercicio: 2025, entes: todosPref.length + governadores.length, comErro: 0 }
    },
    cargos: {
      federais: { total: federais.length, comNota: fedCom, media: demoMedia(federais) },
      governadores: { total: governadores.length, comNota: govCom, media: demoMedia(governadores) },
      prefeitos: { total: todosPref.length, comNota: prefCom, media: demoMedia(todosPref) },
      estaduais: { total: 0 }, vereadores: { total: 0 }
    }
  };
  let totE = 0, totV = 0;
  for (const uf of UFS) {
    const nE = Math.min(94, DEMO_BANCADA[uf] * 2);
    const rE = aleatorio(1000 + UFS.indexOf(uf));
    DEMO.estaduais[uf] = { uf, ano: 2022, itens: Array.from({ length: nE }, (_, k) => demoPessoa(rE, { id: String(600000 + UFS.indexOf(uf) * 100 + k), uf, situacao: k % 3 ? 'Eleito por quociente partidário' : 'Eleito por média' })) };
    totE += nE;
    if (uf === 'DF') { DEMO.vereadores[uf] = null; continue; }
    const rV = aleatorio(5000 + UFS.indexOf(uf));
    const itens = [];
    prefeitos[uf].forEach((p, k) => {
      const n = 9 + (k % 5);
      for (let v = 0; v < n; v++) itens.push(demoPessoa(rV, { id: String(500000000 + UFS.indexOf(uf) * 10000 + k * 20 + v), uf, municipio: p.municipio, cod: p.cod }));
    });
    DEMO.vereadores[uf] = { uf, ano: 2024, itens };
    totV += itens.length;
  }
  DEMO.meta.cargos.estaduais.total = totE;
  DEMO.meta.cargos.vereadores.total = totV;
  DEMO.pronto = true;
}

function gerarDemo(nome) {
  demoConstruir();
  if (nome === 'meta.json') return DEMO.meta;
  if (nome === 'metodo.json') return METODO_DEMO;
  if (nome === 'federais.json') return DEMO.federais;
  if (nome === 'ranking-prefeitos.json') return DEMO.ranking;
  if (nome === 'governadores.json') return DEMO.governadores;
  const m = /^(prefeitos|estaduais|vereadores)-([A-Z]{2})\.json$/.exec(nome);
  if (m) {
    const [, tipo, uf] = m;
    const dado = tipo === 'prefeitos' ? (DEMO.prefeitos[uf] ? { uf, ano: 2024, exercicio: 2025, itens: DEMO.prefeitos[uf] } : null) : DEMO[tipo][uf];
    if (dado) return dado;
  }
  throw new Error(`HTTP 404 em ${nome}`);
}

  <script>
'use strict';

/* =====================================================================
   Placar Público — consulta ao vivo à Câmara dos Deputados
   Estas abas do perfil dos deputados federais (Projetos, Votações,
   Presença e Gastos) vêm do aplicativo De Olho na Câmara. Elas consultam
   a API de Dados Abertos da Câmara na hora em que a pessoa abre a aba.
   ===================================================================== */

/* Proposições em que o deputado consta como autor, com data de apresentação no ano.
   Filtrar pelo campo "ano" deixaria de fora emendas, pareceres e destaques (a API grava
   ano 0 neles), e o total ficaria menor que o do portal da Câmara. Por isso a busca é
   por data de apresentação, em 4 trimestres, porque a API limita cada consulta a 3 meses. */
async function carregarProjetos(id, ano) {
  const trimestres = [['01-01', '03-31'], ['04-01', '06-30'], ['07-01', '09-30'], ['10-01', '12-31']];
  const partes = await Promise.all(trimestres.map(([ini, fim]) => buscarTudo(
    `/proposicoes?idDeputadoAutor=${id}&dataApresentacaoInicio=${ano}-${ini}&dataApresentacaoFim=${ano}-${fim}&ordem=DESC&ordenarPor=id`)));
  const itens = [...new Map(partes.flatMap(p => p.itens).map(p => [p.id, p])).values()]
    .sort((a, b) => (b.dataApresentacao || '').localeCompare(a.dataApresentacao || ''));
  return { itens, truncado: partes.some(p => p.truncado) };
}

// "PL 2385/2026"; documentos sem ano (pareceres, destaques) aparecem só com sigla e número.
const nomeProposicao = p => `${p.siglaTipo} ${p.numero}${p.ano ? `/${p.ano}` : ''}`;

/* Presença: compara as sessões deliberativas encerradas do Plenário no ano com as
   sessões em que o deputado tem presença registrada. Conferido com a frequência
   publicada no portal da Câmara. */
async function carregarPresenca(id, ano) {
  const fim = ano === ANO_ATUAL ? isoDia(new Date()) : `${ano}-12-31`;
  const periodo = `dataInicio=${ano}-01-01&dataFim=${fim}&ordem=ASC&ordenarPor=dataHoraInicio`;
  const [plenario, dele] = await Promise.all([
    buscarTudo(`/eventos?${periodo}&idOrgao=${ID_PLENARIO}`),
    buscarTudo(`/deputados/${id}/eventos?${periodo}`)
  ]);
  const ehSessao = e => e.descricaoTipo === 'Sessão Deliberativa' && e.situacao === 'Encerrada';
  const sessoes = [...new Map(plenario.itens.filter(ehSessao).map(e => [e.id, e])).values()];
  const presencas = new Set(dele.itens.filter(ehSessao).map(e => e.id));
  const ausentes = sessoes.filter(s => !presencas.has(s.id));
  const total = sessoes.length;
  const presente = total - ausentes.length;
  return {
    total, presente, ausentes,
    pct: total ? Math.round((presente / total) * 100) : null
  };
}

/* Gastos da cota parlamentar. O campo valorLiquido da API vem com o sinal trocado em
   muitos lançamentos, então o líquido é calculado aqui: valor do documento menos glosa.
   Esse cálculo reproduz exatamente o total que o portal da Câmara divulga. */
async function carregarGastos(id, ano) {
  const { itens, truncado } = await buscarTudo(
    `/deputados/${id}/despesas?ano=${ano}&ordem=DESC&ordenarPor=dataDocumento`, 40);
  const lancamentos = itens.map(x => ({
    mes: x.mes,
    tipo: frase(x.tipoDespesa),
    fornecedor: x.nomeFornecedor || 'Fornecedor não informado',
    data: x.dataDocumento,
    url: urlSegura(x.urlDocumento),
    valor: (x.valorDocumento || 0) - (x.valorGlosa || 0)
  }));
  const somar = chave => {
    const m = new Map();
    lancamentos.forEach(l => m.set(l[chave], (m.get(l[chave]) || 0) + l.valor));
    return [...m.entries()].map(([nome, valor]) => ({ nome, valor })).sort((a, b) => b.valor - a.valor);
  };
  const porMes = Array.from({ length: 12 }, () => 0);
  lancamentos.forEach(l => { if (l.mes >= 1 && l.mes <= 12) porMes[l.mes - 1] += l.valor; });
  return {
    total: lancamentos.reduce((a, l) => a + l.valor, 0),
    quantidade: lancamentos.length,
    truncado, porMes,
    porTipo: somar('tipo'),
    porFornecedor: somar('fornecedor'),
    maiores: [...lancamentos].sort((a, b) => b.valor - a.valor).slice(0, 8)
  };
}

/* Votações nominais do Plenário nos últimos 12 meses.
   A API não tem "votos de um deputado". O caminho é: listar as votações do Plenário,
   separar as nominais (a descrição traz o placar, "Sim: 252; Não: 176") e ler os votos
   de cada uma. Isso é feito uma vez e vale para todos os deputados da visita. */
const ouvintesProgresso = new Set();
let textoProgresso = '';
let promessaVotacoes = null;
function informarProgresso(texto) { textoProgresso = texto; ouvintesProgresso.forEach(f => f(texto)); }

function carregarVotacoes() {
  if (promessaVotacoes) return promessaVotacoes;
  promessaVotacoes = (async () => {
    informarProgresso('Buscando as votações do Plenário…');
    const janelas = [];
    let fim = new Date();
    for (let i = 0; i < JANELAS_VOTACOES; i++) {
      const ini = somarDias(fim, -DIAS_JANELA);
      janelas.push([isoDia(ini), isoDia(fim)]);
      fim = somarDias(ini, -1);
    }
    let prontas = 0;
    const listas = await Promise.all(janelas.map(async ([ini, f]) => {
      const r = await buscarTudo(
        `/votacoes?idOrgao=${ID_PLENARIO}&dataInicio=${ini}&dataFim=${f}&ordem=DESC&ordenarPor=dataHoraRegistro`, 8);
      informarProgresso(`Buscando as votações do Plenário… (${++prontas} de ${janelas.length} períodos)`);
      return r.itens;
    }));
    const nominais = [...new Map(listas.flat().filter(v => /\bSim:\s*\d+/.test(v.descricao || '')).map(v => [v.id, v])).values()];
    let lidas = 0, falhas = 0;
    await emLotes(nominais, 6, async v => {
      try {
        const r = await getJSON(`/votacoes/${v.id}/votos`, { vazioSe404: true });
        v.votos = new Map((r.dados || []).map(x => [x.deputado_ && x.deputado_.id, x.tipoVoto]));
      } catch (e) {
        console.error(e);
        falhas++;
        v.votos = new Map();   // fica de fora e é contada no aviso da tela
      }
      informarProgresso(`Lendo os votos de ${nominais.length} votações nominais… (${++lidas} de ${nominais.length})`);
    });
    const comVotos = nominais.filter(v => v.votos.size > 0);
    return {
      falhas,                                              // erro de rede ao ler os votos
      semLista: nominais.length - comVotos.length - falhas, // a API não publicou a lista de votos
      nominais: comVotos.sort((a, b) => (a.dataHoraRegistro < b.dataHoraRegistro ? 1 : -1))
    };
  })();
  promessaVotacoes.catch(() => { promessaVotacoes = null; });
  return promessaVotacoes;
}

const carregarDetalheVotacao = id => getJSON(`/votacoes/${encodeURIComponent(id)}`);
function rotuloRede(url) {
  try {
    const h = new URL(url).hostname.replace(/^www\./, '');
    if (/twitter|x\.com/.test(h)) return 'X (Twitter)';
    if (/instagram/.test(h)) return 'Instagram';
    if (/facebook/.test(h)) return 'Facebook';
    if (/youtube|youtu\.be/.test(h)) return 'YouTube';
    if (/tiktok/.test(h)) return 'TikTok';
    return h;
  } catch (e) { return 'Link'; }
}
function tile(chave, valor, legenda) {
  const el = $(`[data-stat="${chave}"]`);
  if (!el) return;
  $('.stat-valor', el).textContent = valor;
  $('.stat-legenda', el).textContent = legenda;
}

/* --- Aba Projetos --- */

function montarProjetos(el, { itens, truncado }, { ano }) {
  const grupos = {
    projetos: { rotulo: 'Projetos e propostas', filtro: p => SIGLAS_PROJETO.has(p.siglaTipo) },
    requerimentos: { rotulo: 'Requerimentos e indicações', filtro: p => SIGLAS_REQUERIMENTO.has(p.siglaTipo) },
    outros: { rotulo: 'Emendas, pareceres e outros', filtro: p => !SIGLAS_PROJETO.has(p.siglaTipo) && !SIGLAS_REQUERIMENTO.has(p.siglaTipo) },
    todos: { rotulo: 'Todos', filtro: () => true }
  };
  const contagem = Object.fromEntries(Object.entries(grupos).map(([k, g]) => [k, itens.filter(g.filtro).length]));
  const porSigla = [...itens.reduce((m, p) => m.set(p.siglaTipo, (m.get(p.siglaTipo) || 0) + 1), new Map())]
    .sort((a, b) => b[1] - a[1]);
  const vista = { grupo: contagem.projetos ? 'projetos' : 'todos', busca: '', limite: 40 };

  if (!itens.length) {
    return mostrar(el, html`<h2 class="painel-titulo">Projetos em ${ano}</h2>
      <p class="painel-sub">Nenhuma proposição em que este deputado conste como autor em ${ano}.</p>`);
  }

  // Cada montagem usa um contêiner novo, para os ouvintes de clique não se acumularem.
  const raiz = document.createElement('div');
  el.replaceChildren(raiz);

  mostrar(raiz, html`
    <h2 class="painel-titulo">Proposições em ${ano}</h2>
    <p class="painel-sub">${plural(itens.length, 'proposição apresentada', 'proposições apresentadas')} em ${ano}, como autor ou coautor${truncado ? ' (lista limitada)' : ''}. Inclui requerimentos, emendas, pareceres e destaques, como no total do portal da Câmara.</p>
    <div class="chips" role="group" aria-label="Tipo de proposição">
      ${Object.entries(grupos).map(([k, g]) => html`<button class="chip" type="button" data-grupo="${k}" aria-pressed="false">${g.rotulo}<b>${contagem[k]}</b></button>`)}
    </div>
    <p class="tipos-linha">Por tipo: ${porSigla.map(([s, n], i) => html`${i ? ' · ' : ''}<abbr title="${NOMES_TIPO[s] || s}">${s}</abbr> ${n}`)}</p>
    <label class="campo busca"><span>Buscar no texto</span><input id="busca-prop" type="search" placeholder="Ex.: saúde, educação, imposto" autocomplete="off"></label>
    <p class="contagem" id="contagem-prop" aria-live="polite"></p>
    <ul id="lista-prop"></ul>
    <div class="mais-itens" id="mais-prop"></div>`);

  const lista = $('#lista-prop', raiz);
  const desenhar = () => {
    raiz.querySelectorAll('[data-grupo]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.grupo === vista.grupo)));
    const q = semAcento(vista.busca.trim());
    const filtrados = itens.filter(p => grupos[vista.grupo].filtro(p) && (!q || semAcento(p.ementa).includes(q) || semAcento(nomeProposicao(p)).includes(q)));
    const visiveis = filtrados.slice(0, vista.limite);
    $('#contagem-prop', raiz).textContent = plural(filtrados.length, 'proposição', 'proposições');
    mostrar(lista, filtrados.length ? html`${visiveis.map(p => {
      const longo = (p.ementa || '').length > 240;
      return html`<li class="prop">
        <div class="prop-cab">
          <span class="prop-id">${nomeProposicao(p)}</span>
          <span class="prop-tipo">${NOMES_TIPO[p.siglaTipo] || ''}</span>
          <time class="prop-data">${dataBR(p.dataApresentacao)}</time>
        </div>
        <p class="prop-texto ${longo ? 'curto' : ''}">${p.ementa || 'Sem ementa informada.'}</p>
        <div class="prop-links">
          ${longo ? html`<button class="link-botao" type="button" data-expandir>Ler tudo</button>` : ''}
          <a href="${PORTAL}/propostas-legislativas/${p.id}" target="_blank" rel="noopener">Ver tramitação no portal da Câmara</a>
        </div>
      </li>`;
    })}` : html`<li class="vazio">Nenhuma proposição encontrada.</li>`);
    mostrar($('#mais-prop', raiz), filtrados.length > vista.limite
      ? html`<button class="botao" type="button" data-mais>Mostrar mais (${filtrados.length - vista.limite} restantes)</button>` : html``);
  };

  raiz.addEventListener('click', e => {
    const g = e.target.closest('[data-grupo]');
    if (g) { vista.grupo = g.dataset.grupo; vista.limite = 40; return desenhar(); }
    if (e.target.closest('[data-mais]')) { vista.limite += 40; return desenhar(); }
    const x = e.target.closest('[data-expandir]');
    if (x) {
      const texto = x.closest('.prop').querySelector('.prop-texto');
      const aberto = texto.classList.toggle('curto');
      x.textContent = aberto ? 'Ler tudo' : 'Recolher';
    }
  });
  $('#busca-prop', raiz).addEventListener('input', e => { vista.busca = e.target.value; vista.limite = 40; desenhar(); });
  desenhar();
}

/* --- Aba Presença --- */

/* --- Aba Gastos --- */

function listaBarras(linhas, maximo) {
  return html`<ul class="hb">${linhas.map(l => html`
    <li class="${l.futuro ? 'futuro' : ''}">
      <span class="hb-rot">${l.rotulo}</span>
      <span class="hb-barra"><span style="width:${maximo > 0 ? Math.max(0, Math.min(100, (l.valor / maximo) * 100)).toFixed(1) : 0}%"></span></span>
      <span class="hb-valor" title="${fmtBRL.format(l.valor)}">${l.futuro ? '—' : fmtBRL.format(l.valor)}</span>
    </li>`)}</ul>`;
}

function montarGastos(el, d, { id, ano }) {
  if (!d.quantidade) {
    return mostrar(el, html`<h2 class="painel-titulo">Cota parlamentar em ${ano}</h2>
      <p class="painel-sub">Nenhum gasto registrado em ${ano}.</p>`);
  }
  const NOMES_MES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  const mesAtual = ano === ANO_ATUAL ? new Date().getMonth() + 1 : 12;
  const meses = d.porMes.map((valor, i) => ({ rotulo: NOMES_MES[i], valor, futuro: i + 1 > mesAtual }));
  const maxMes = Math.max(...meses.map(m => m.valor), 0);
  const tipos = d.porTipo.slice(0, 10).map(t => ({ rotulo: t.nome, valor: t.valor }));
  const resto = d.porTipo.slice(10).reduce((a, t) => a + t.valor, 0);
  if (d.porTipo.length > 10) tipos.push({ rotulo: 'Outras categorias', valor: resto });
  const forn = d.porFornecedor.slice(0, 8).map(f => ({ rotulo: f.nome, valor: f.valor }));

  mostrar(el, html`
    <h2 class="painel-titulo">Cota parlamentar em ${ano}</h2>
    <p class="painel-sub">Verba para despesas do mandato, como passagens, combustível, divulgação e escritório.</p>
    <p class="gasto-total">${fmtBRL.format(d.total)}</p>
    <p class="painel-sub">${plural(d.quantidade, 'lançamento', 'lançamentos')} no ano${d.truncado ? ' (lista limitada)' : ''}.</p>

    <div class="secao"><h3>Por mês</h3>${listaBarras(meses, maxMes)}</div>
    <div class="secao"><h3>Por tipo de despesa</h3>${listaBarras(tipos, Math.max(...tipos.map(t => t.valor), 0))}</div>
    <div class="secao"><h3>Maiores fornecedores</h3>${listaBarras(forn, Math.max(...forn.map(f => f.valor), 0))}</div>
    <div class="secao"><h3>Maiores lançamentos</h3>
      <ul class="lanc">${d.maiores.map(l => html`
        <li>
          <div>
            <div class="lanc-forn">${l.fornecedor}</div>
            <div class="lanc-meta">${l.tipo} · ${dataBR(l.data)}${l.url ? html` · <a href="${l.url}" target="_blank" rel="noopener">ver documento</a>` : ''}</div>
          </div>
          <div class="lanc-valor">${fmtBRL.format(l.valor)}</div>
        </li>`)}</ul>
    </div>
    <p class="nota">Valores líquidos: valor do documento menos glosas (partes que a Câmara não reembolsou). O total confere com o divulgado no
      <a href="${PORTAL}/deputados/${id}" target="_blank" rel="noopener">portal da Câmara</a>.</p>`);
}

/* --- Aba Votações --- */

const TIPOS_VOTO = {
  Sim: { chave: 'sim', rotulo: 'Sim' },
  'Não': { chave: 'nao', rotulo: 'Não' },
  'Abstenção': { chave: 'abst', rotulo: 'Abstenção' },
  'Obstrução': { chave: 'obstr', rotulo: 'Obstrução' },
  'Artigo 17': { chave: 'art17', rotulo: 'Presidindo a sessão' }
};
const ORDEM_VOTOS = ['sim', 'nao', 'abst', 'obstr', 'art17', 'secreto', 'ausente', 'outro'];
const ROTULO_CHAVE = {
  sim: 'Sim', nao: 'Não', abst: 'Abstenção', obstr: 'Obstrução', art17: 'Presidindo a sessão',
  secreto: 'Voto secreto', ausente: 'Não votou', outro: 'Outro'
};

function classificarVoto(votacao, depId) {
  if (!votacao.votos.has(depId)) return { chave: 'ausente', rotulo: 'Não votou' };
  const t = votacao.votos.get(depId);
  if (t == null) return { chave: 'secreto', rotulo: 'Voto secreto' };
  return TIPOS_VOTO[t] || { chave: 'outro', rotulo: t };
}

async function painelVotacoes(painel, depId, vale) {
  mostrar(painel, html`<p class="progresso" id="progresso">${textoProgresso || 'Preparando a consulta…'}</p>
    <p class="painel-sub">Na primeira vez, a consulta lê os votos de todo o Plenário e leva alguns segundos. Depois, trocar de deputado é imediato.</p>
    ${esqueletoLinhas(5)}`);
  const ouvinte = t => { const p = $('#progresso'); if (p) p.textContent = t; };
  ouvintesProgresso.add(ouvinte);
  try {
    const { nominais, falhas, semLista } = await carregarVotacoes();
    if (!vale()) return;
    montarVotos(painel, Number(depId), nominais, falhas + semLista);
  } catch (e) {
    console.error(e);
    if (vale()) mostrarErro(painel, 'Não foi possível carregar as votações.', () => painelVotacoes(painel, depId, vale));
  } finally {
    ouvintesProgresso.delete(ouvinte);
  }
}

function montarVotos(el, depId, nominais, falhas = 0) {
  if (!nominais.length) {
    return mostrar(el, html`<h2 class="painel-titulo">Votações nominais</h2>
      <p class="painel-sub">Não encontramos votações nominais do Plenário nos últimos 12 meses.</p>`);
  }
  const registros = nominais.map(v => ({ v, voto: classificarVoto(v, depId) }));
  const contagem = {};
  registros.forEach(r => { contagem[r.voto.chave] = (contagem[r.voto.chave] || 0) + 1; });
  const votou = registros.length - (contagem.ausente || 0);
  const chaves = ORDEM_VOTOS.filter(k => contagem[k]);
  const vista = { filtro: 'todos', limite: 25 };
  tile('votacoes', `${votou} de ${registros.length}`, 'votações nominais em que votou (12 meses)');

  const maisAntiga = dataBR(nominais[nominais.length - 1].data);
  const maisNova = dataBR(nominais[0].data);

  const raiz = document.createElement('div');
  el.replaceChildren(raiz);

  mostrar(raiz, html`
    <h2 class="painel-titulo">Como votou nos últimos 12 meses</h2>
    <p class="painel-sub">${plural(registros.length, 'votação nominal', 'votações nominais')} no Plenário, de ${maisAntiga} a ${maisNova}. Votações simbólicas, em que ninguém registra voto individual, não entram.</p>
    <div class="pilha" role="img" aria-label="Distribuição dos votos">
      ${chaves.map(k => html`<span class="cor-${k}" style="flex:${contagem[k]}" title="${ROTULO_CHAVE[k]}: ${contagem[k]}"></span>`)}
    </div>
    <ul class="legenda">${chaves.map(k => html`<li><i class="cor-${k}"></i>${ROTULO_CHAVE[k]} <b>${contagem[k]}</b></li>`)}</ul>
    <div class="chips" role="group" aria-label="Filtrar por voto">
      <button class="chip" type="button" data-voto="todos" aria-pressed="true">Todos<b>${registros.length}</b></button>
      ${chaves.map(k => html`<button class="chip" type="button" data-voto="${k}" aria-pressed="false">${ROTULO_CHAVE[k]}<b>${contagem[k]}</b></button>`)}
    </div>
    <ul id="lista-votos"></ul>
    <div class="mais-itens" id="mais-votos"></div>
    <p class="nota">“Não votou” significa que não há voto registrado dele numa votação em que outros deputados votaram. Pode ser ausência, licença ou mandato ainda não iniciado.
      Nas votações secretas, a API informa quem participou, mas não como votou.
      ${falhas ? ` ${plural(falhas, 'votação nominal ficou de fora', 'votações nominais ficaram de fora')} desta contagem porque a API não trouxe a lista de votos. Por isso o total pode diferir em poucas votações do que o portal da Câmara mostra.` : ''}</p>`);

  const lista = $('#lista-votos', raiz);
  const desenhar = () => {
    raiz.querySelectorAll('[data-voto]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.voto === vista.filtro)));
    const filtrados = registros.filter(r => vista.filtro === 'todos' || r.voto.chave === vista.filtro);
    const visiveis = filtrados.slice(0, vista.limite);
    mostrar(lista, html`${visiveis.map(({ v, voto }) => {
      const m = /^(.*?)\s*(Sim:\s*\d+.*)$/s.exec(v.descricao || '');
      const texto = m ? m[1] : v.descricao;
      const placar = m ? m[2] : '';
      return html`<li class="voto-linha">
        <div>
          <div class="voto-cab"><time>${dataBR(v.data)}</time>${v.aprovacao === 1 ? html`<span>Aprovada</span>` : v.aprovacao === 0 ? html`<span>Rejeitada</span>` : ''}</div>
          <p class="voto-desc">${texto}</p>
          <p class="voto-prop" data-votacao="${v.id}"></p>
          ${placar ? html`<p class="placar">Placar geral: ${placar}</p>` : ''}
        </div>
        <span class="pill v-${voto.chave}">${voto.rotulo}</span>
      </li>`;
    })}`);
    mostrar($('#mais-votos', raiz), filtrados.length > vista.limite
      ? html`<button class="botao" type="button" data-mais>Mostrar mais (${filtrados.length - vista.limite} restantes)</button>` : html``);
    preencherProposicoes(visiveis.map(r => r.v));
  };

  raiz.addEventListener('click', e => {
    const b = e.target.closest('[data-voto]');
    if (b) { vista.filtro = b.dataset.voto; vista.limite = 25; return desenhar(); }
    if (e.target.closest('[data-mais]')) { vista.limite += 25; desenhar(); }
  });
  desenhar();
}

// Depois da lista aparecer, busca qual proposição cada votação trata.
function preencherProposicoes(votacoes) {
  emLotes(votacoes, 5, async v => {
    try {
      const det = (await carregarDetalheVotacao(v.id)).dados || {};
      const p = (det.proposicoesAfetadas || [])[0];
      document.querySelectorAll(`[data-votacao="${v.id}"]`).forEach(no => {
        if (!p || no.dataset.pronto) return;
        no.dataset.pronto = '1';
        const ementa = (p.ementa || '').length > 260 ? `${p.ementa.slice(0, 260)}…` : (p.ementa || '');
        mostrar(no, html`<strong>${nomeProposicao(p)}</strong> · ${ementa}
          <a href="${PORTAL}/propostas-legislativas/${p.id}" target="_blank" rel="noopener">tramitação</a>`);
      });
    } catch (e) { /* o detalhe é opcional; a votação continua visível */ }
  });
}

</script>
  <script>
'use strict';

/* =====================================================================
   Placar Público — telas dos cargos
   Faixas de aviso, abas de cargo, ranking (maiores e menores notas,
   lista completa com filtros) e a lista dos cargos que ainda não têm nota.

/* ---------- Faixas de aviso (modo demonstração, falha de atualização) ---------- */

function montarFaixas() {
  const el = $('#faixas');
  if (!el) return;
  const partes = [];
  if (DADOS.demo) {
    const porque = DADOS.motivoDemo === 'arquivo-local'
      ? 'Você abriu o site direto do computador, e assim os arquivos de dados reais não podem ser lidos.'
      : 'Os arquivos de dados reais ainda não foram gerados neste endereço.';
    partes.push(html`<div class="faixa faixa-demo" role="status"><div class="cx">
      <strong>Modo demonstração:</strong> nomes, notas e números inventados, só para mostrar como o site funciona. ${porque}
      <a href="#/fontes">Como ver os dados reais</a>.</div></div>`);
  } else {
    const f = (DADOS.meta && DADOS.meta.fontes) || {};
    const nomes = { camara: 'Câmara dos Deputados', tse: 'TSE (lista de eleitos)', siconfi: 'Tesouro Nacional (contas públicas)' };
    const falhas = Object.entries(nomes).filter(([k]) => f[k] && f[k].ok === false);
    if (falhas.length) {
      partes.push(html`<div class="faixa" role="status"><div class="cx">
        <strong>Atenção:</strong> a última atualização falhou para ${falhas.map(([k, n], i) => html`${i ? ', ' : ''}${n}${f[k].atualizadoEm ? ` (últimos dados bons: ${dataHoraBR(f[k].atualizadoEm)})` : ''}`)}.
        O site continua mostrando os dados anteriores. <a href="#/fontes">Detalhes</a></div></div>`);
    }
    const camara = f.camara && f.camara.atualizadoEm;
    if (camara && Date.now() - new Date(camara).getTime() > 3 * 86400000 && !falhas.some(([k]) => k === 'camara')) {
      partes.push(html`<div class="faixa" role="status"><div class="cx"><strong>Atenção:</strong> os dados da Câmara não são atualizados desde ${dataHoraBR(camara)}.</div></div>`);
    }
  }
  mostrar(el, html`${partes}`);
}

/* ---------- Abas de cargo ---------- */

function abasCargos(atual) {
  const metaCargos = (DADOS.meta && DADOS.meta.cargos) || {};
  return html`<nav class="cargos" aria-label="Cargos">${ORDEM_CARGOS.map(k => {
    const c = CARGOS[k];
    const total = metaCargos[k] && metaCargos[k].total;

function cabecalhoCargo(cargo, inicio) {
